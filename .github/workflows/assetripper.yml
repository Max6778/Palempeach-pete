name: Extract assets (AssetRipper)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rip:
    runs-on: ubuntu-latest
    steps:
      - name: Download and unzip game
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir game
          gh release download game2 --repo ${{ github.repository }} -p "Family_Time_Ep_3_WINDOWS_DX11_b108.zip" -O Family_Time_Ep_3_WINDOWS_DX11_b108.zip
          unzip -q Family_Time_Ep_3_WINDOWS_DX11_b108.zip -d game
      - name: Download AssetRipper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir ar_dl ar
          gh release download --repo AssetRipper/AssetRipper -p "*linux_x64*" -D ar_dl
          ls -la ar_dl
          for f in ar_dl/*; do
            case "$f" in
              *.zip) unzip -q "$f" -d ar ;;
              *.tar.gz|*.tgz) tar -xzf "$f" -C ar ;;
              *.tar.xz) tar -xJf "$f" -C ar ;;
              *.tar) tar -xf "$f" -C ar ;;
            esac
          done
          EXE=$(find ar -name "AssetRipper.GUI.Free" -type f | head -n 1)
          echo "Found: $EXE"
          chmod +x "$EXE"
          echo "EXE=$PWD/$EXE" >> $GITHUB_ENV
      - name: Run AssetRipper
        run: |
          DATA=$(dirname "$(find game -name globalgamemanagers | head -n 1)")
          GAMEDIR="$PWD/$(dirname "$DATA")"
          echo "Game folder: $GAMEDIR"
          "$EXE" --headless --port 5000 --log-path "$PWD/ar.log" > ar_stdout.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:5000 > /dev/null && break
            sleep 2
          done
          curl -s --max-time 600 -X POST --data-urlencode "Path=$GAMEDIR" http://127.0.0.1:5000/LoadFolder
          curl -s --max-time 1800 -X POST --data-urlencode "Path=$PWD/export" http://127.0.0.1:5000/Export/UnityProject
          sleep 5
          pkill -f AssetRipper || true
          du -sh export
      - name: Show logs
        if: always()
        run: |
          tail -n 40 ar.log || true
          tail -n 40 ar_stdout.log || true
      - name: Zip the exported project
        run: |
          cd export
          zip -qr ../unity-project.zip .
          cd ..
          ls -lh unity-project.zip
      - name: Publish to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="unity-project-${{ github.run_number }}"
          gh release create "$TAG" unity-project.zip \
            --repo ${{ github.repository }} \
            --title "Unity project export (run ${{ github.run_number }})" \
            --notes "AssetRipper export of Family Time Ep 3."
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/$TAG"
