name: Extract assets (AssetRipper)

on:
  workflow_dispatch:

jobs:
  rip:
    runs-on: ubuntu-latest
    steps:
      - name: Download and unzip game
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir game
          gh release download game1 --repo ${{ github.repository }} -p "Game.zip" -O game.zip
          unzip -q game.zip -d game

      - name: Download AssetRipper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo AssetRipper/AssetRipper -p "AssetRipper_linux_x64.zip" -O ar.zip
          mkdir ar
          unzip -q ar.zip -d ar
          EXE=$(find ar -name "AssetRipper.GUI.Free" -type f | head -n 1)
          chmod +x "$EXE"
          echo "EXE=$PWD/$EXE" >> $GITHUB_ENV

      - name: Run AssetRipper
        run: |
          DATA=$(dirname "$(find game -name globalgamemanagers | head -n 1)")
          GAMEDIR="$PWD/$(dirname "$DATA")"
          echo "Game folder: $GAMEDIR"
          mkdir -p out
          "$EXE" --port 8080 --launch-browser=false > ar.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s localhost:8080 > /dev/null && break
            sleep 2
          done
          curl -s -X POST localhost:8080/LoadFolder --data-urlencode "path=$GAMEDIR"
          curl -s -X POST localhost:8080/Export/UnityProject --data-urlencode "path=$PWD/out"
          sleep 5
          pkill -f AssetRipper || true
          du -sh out

      - name: Show log
        if: always()
        run: tail -n 40 ar.log

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: unity-project
          path: out
