name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      script_mode:
        description: "How AssetRipper exports the game code"
        type: choice
        default: Hybrid
        options:
          - Hybrid
          - Decompiled
          - DllExportWithoutRenaming
      shader_mode:
        description: "How AssetRipper exports the game's shaders"
        type: choice
        default: Dummy
        options:
          - Dummy
          - Decompile
          - Yaml

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Download and unzip game
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir game
          gh release download game1 --repo ${{ github.repository }} -p "Game.zip" -O game.zip
          unzip -q game.zip -d game
          test -n "$(find game -name globalgamemanagers | head -n 1)" || { echo "ERROR: game files not found"; exit 1; }

      - name: Download AssetRipper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir ar_dl ar
          gh release download --repo AssetRipper/AssetRipper -p "*linux_x64*" -D ar_dl
          for f in ar_dl/*; do
            case "$f" in
              *.zip) unzip -q "$f" -d ar ;;
              *.tar.gz|*.tgz) tar -xzf "$f" -C ar ;;
              *.tar.xz) tar -xJf "$f" -C ar ;;
              *.tar) tar -xf "$f" -C ar ;;
            esac
          done
          EXE=$(find ar -name "AssetRipper.GUI.Free" -type f | head -n 1)
          test -n "$EXE" || { echo "ERROR: AssetRipper not found"; ls -R ar_dl; exit 1; }
          chmod +x "$EXE"
          echo "EXE=$PWD/$EXE" >> $GITHUB_ENV

      - name: Export Unity project with AssetRipper
        run: |
          DATA=$(dirname "$(find game -name globalgamemanagers | head -n 1)")
          GAMEDIR="$PWD/$(dirname "$DATA")"
          "$EXE" --headless --port 5000 --log-path "$PWD/ar.log" > ar_stdout.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:5000 > /dev/null && break
            sleep 2
          done
          echo "Set script mode: ${{ inputs.script_mode }}"
          echo "Set shader mode: ${{ inputs.shader_mode }}"
          curl -s -o /dev/null -w "settings http %{http_code}\n" -X POST \
            --data-urlencode "ScriptExportMode=${{ inputs.script_mode }}" \
            --data-urlencode "ShaderExportMode=${{ inputs.shader_mode }}" \
            http://127.0.0.1:5000/Settings/Update
          curl -s -o /dev/null -w "load http %{http_code}\n" --max-time 600 -X POST \
            --data-urlencode "Path=$GAMEDIR" http://127.0.0.1:5000/LoadFolder
          curl -s -o /dev/null -w "export http %{http_code}\n" --max-time 1800 -X POST \
            --data-urlencode "Path=$PWD/export" http://127.0.0.1:5000/Export/UnityProject
          sleep 5
          pkill -f AssetRipper || true
          grep -m1 "ScriptExportMode" ar.log || true
          grep -m1 "ShaderExportMode" ar.log || true
          echo "shader files: $(find export/ExportedProject/Assets -name '*.shader' | wc -l), tiny ones (under 2 KB): $(find export/ExportedProject/Assets -name '*.shader' -size -2k | wc -l)"
          ls -l export/ExportedProject/Assets/Shader | grep -i -E "PixelFilter|SpriteStandard|Standard.shader" || true
          test -d export/ExportedProject/Assets || { echo "ERROR: export failed"; tail -n 40 ar.log; exit 1; }
          test -d export/ExportedProject/ProjectSettings || { echo "ERROR: no ProjectSettings"; exit 1; }
          du -sh export

      - name: Inspect original Plus render pipeline before Android patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("export/ExportedProject/Assets")
          meta_to_asset = {}
          for meta in root.rglob("*.meta"):
              try:
                  text = meta.read_text(errors="ignore")
              except OSError:
                  continue
              match = re.search(r"^guid:\s*([0-9a-f]{32})", text, re.M)
              if match:
                  meta_to_asset[match.group(1)] = str(meta)[:-5]

          needles = (
              "m_RendererDataList:", "m_RendererFeatures:", "m_RenderingMode:",
              "m_OpaqueLayerMask:", "m_TransparentLayerMask:", "m_RenderType:",
              "m_ClearDepth:", "m_UseNativeRenderPass:", "m_DepthTexture:",
              "m_RequireDepthTexture:", "m_RequireOpaqueTexture:",
          )
          printed = 0
          print("=== Original renderer and pipeline YAML references ===")
          for asset in root.rglob("*"):
              if not asset.is_file() or asset.suffix not in (".asset", ".unity", ".prefab"):
                  continue
              try:
                  lines = asset.read_text(errors="ignore").splitlines()
              except OSError:
                  continue
              matches = [i for i, line in enumerate(lines) if any(key in line for key in needles)]
              if not matches:
                  continue
              print("ASSET", asset)
              shown = set()
              for i in matches:
                  for j in range(max(0, i - 1), min(len(lines), i + 5)):
                      if j not in shown:
                          line = lines[j]
                          print(f"{j + 1}: {line[:240]}")
                          ref = re.search(r"guid:\s*([0-9a-f]{32})", line)
                          if ref and ref.group(1) in meta_to_asset:
                              print("    GUID_PATH", ref.group(1), meta_to_asset[ref.group(1)])
                          shown.add(j)
                  print("...")
              printed += 1
              if printed >= 40:
                  print("Stopped after 40 matching assets")
                  break
          print("Matching assets:", printed)
          settings = Path("export/ExportedProject/ProjectSettings/GraphicsSettings.asset")
          if settings.exists():
              print("=== GraphicsSettings render-pipeline reference ===")
              for i, line in enumerate(settings.read_text(errors="ignore").splitlines(), 1):
                  if "m_CustomRenderPipeline" in line or "m_RenderPipeline" in line:
                      print(f"{i}: {line[:240]}")
                      ref = re.search(r"guid:\s*([0-9a-f]{32})", line)
                      if ref and ref.group(1) in meta_to_asset:
                          print("    GUID_PATH", ref.group(1), meta_to_asset[ref.group(1)])
          PY

      - name: Install Unity 2020.3.49f1 with Android
        uses: RageAgainstThePixel/unity-setup@v2
        with:
          version-file: None
          unity-version: 2020.3.49f1
          build-targets: Android
          hub-version: '3.14.3'
          cache-installation: true

      - name: Activate Personal license
        uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Install libssl1.1 for Unity's C# compiler
        run: |
          echo "deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://security.ubuntu.com/ubuntu focal-security main" | sudo tee /etc/apt/sources.list.d/focal-security.list
          sudo apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/focal-security.list -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
          sudo apt-get install -y libssl1.1
          ldconfig -p | grep "libssl.so.1.1" || { echo "ERROR: libssl1.1 not installed"; exit 1; }

      - name: Patch game scripts for Android
        run: |
          SCRIPTS=$(find export/ExportedProject/Assets -type d -name "Assembly-CSharp" | head -n 1)
          echo "Scripts folder: $SCRIPTS"
          test -f "$SCRIPTS/InputManager.cs" || { echo "ERROR: InputManager.cs not found"; exit 1; }
          ASSETS="$(dirname "$(dirname "$SCRIPTS")")"
          STREAMING="$ASSETS/StreamingAssets"
          RESOURCE_DIR="$ASSETS/Resources/BaldiStreaming"
          mkdir -p "$RESOURCE_DIR"
          for name in Subtitles_En.json Subtitles_Fr.json; do
            test -s "$STREAMING/$name" || { echo "ERROR: missing $STREAMING/$name"; exit 1; }
            cp "$STREAMING/$name" "$RESOURCE_DIR/$name"
          done
          cat > "$SCRIPTS/LocalizationManager.cs" << 'EOF_LOC'
          using System.Collections.Generic;
          using System.IO;
          using UnityCipher;
          using UnityEngine;

          public class LocalizationManager : Singleton<LocalizationManager>
          {
           private Dictionary<string, string> localizedText;
           private Language currentSubLang;
           private Language currentAudLang;
           private Language currentTextureLang;

           protected override void AwakeFunction()
           {
            base.AwakeFunction();
            LoadLocalizedText("Subtitles_En.json", Language.English);
           }

           public void UpdateCurrentLanguage(Language language) { currentAudLang = language; }
           public void UpdateCurrentTextureLanguage(Language language) { currentTextureLang = language; }

           public void LoadLocalizedText(string fileName, Language language)
           {
            currentSubLang = language;
            localizedText = new Dictionary<string, string>();
            string resourceName = "BaldiStreaming/" + Path.GetFileNameWithoutExtension(fileName);
            TextAsset embedded = Resources.Load<TextAsset>(resourceName);
            string json = embedded == null ? null : embedded.text;
            if (string.IsNullOrEmpty(json) && !Application.isMobilePlatform)
            {
             string path = Path.Combine(Application.streamingAssetsPath, fileName);
             if (File.Exists(path)) json = File.ReadAllText(path);
            }
            if (string.IsNullOrEmpty(json))
            {
             Debug.LogError("Localization text could not be loaded: " + fileName);
             return;
            }
            LocalizationData data = JsonUtility.FromJson<LocalizationData>(json);
            if (data == null || data.items == null)
            {
             Debug.LogError("Localization JSON is invalid: " + fileName);
             return;
            }
            for (int i = 0; i < data.items.Length; i++)
            {
             if (data.items[i] != null && !string.IsNullOrEmpty(data.items[i].key))
              localizedText[data.items[i].key] = data.items[i].value ?? string.Empty;
            }
            Debug.Log("Loaded " + localizedText.Count + " localization strings from " + fileName);
           }

           public string GetLocalizedText(string key) { return GetLocalizedText(key, false); }

           public string GetLocalizedText(string key, bool encrypted)
           {
            if (localizedText == null) LoadLocalizedText("Subtitles_En.json", Language.English);
            if (key != null && localizedText != null && localizedText.TryGetValue(key, out string value))
             return encrypted ? RijndaelEncryption.Decrypt(value, "baldi") : value;
            return key;
           }

           public AudioClip GetLocalizedAudioClip(SoundObject sound)
           {
            AudioClip clip = currentAudLang switch
            {
             Language.English => sound.soundClip,
             Language.Test => sound.testLanguageClip,
             Language.French => sound.frenchClip,
             Language.Japanese => sound.japaneseClip,
             _ => sound.soundClip,
            };
            return clip == null ? sound.soundClip : clip;
           }

           public Material[] GetLocalizedPoster(PosterObject poster)
           {
            return currentTextureLang switch
            {
             Language.English => poster.material,
             Language.Test => poster.testMaterial,
             Language.French => poster.frenchMaterial,
             Language.Japanese => poster.japaneseMaterial,
             _ => poster.material,
            };
           }
          }
          EOF_LOC
          cat > "$SCRIPTS/InputManager.cs" << 'EOF'
          using System.Collections;
          using System.Collections.Generic;
          using Steamworks;
          using UnityEngine;

          // Touch version of the game's input manager (replaces the Rewired + Steam Input version).
          public class InputManager : Singleton<InputManager>
          {
          	// ---- Tuning: change these numbers to adjust how the touch controls feel ----
          	private const float LookScale = 0.12f;
          	private const float CursorScale = 0.35f;
          	private const float TapMaxSeconds = 0.3f;
          	private const float TapMaxMove = 30f;

          	private struct TouchButton
          	{
          		public string id;
          		public string label;
          		public Vector2 center;
          		public float radius;
          	}

          	private HashSet<string> held = new HashSet<string>();

          	private HashSet<string> down = new HashSet<string>();

          	private Dictionary<int, string> fingerButtons = new Dictionary<int, string>();

          	private List<TouchButton> buttons = new List<TouchButton>();

          	private string currentActionSetId = "Interface";

          	private bool inputFrozen;

          	private bool frameStopped;

          	private bool anyTouchDown;

          	private bool tapReleasePending;

          	private int joyFinger = -1;

          	private Vector2 joyOrigin;

          	private Vector2 joyVector;

          	private int lookFinger = -1;

          	private Vector2 lookStart;

          	private float lookStartTime;

          	private Vector2 dragDelta;

          	private Texture2D circleTex;

          	private GUIStyle labelStyle;

          	public InputHandle_t LastUsedInputHandle => default(InputHandle_t);

          	public bool SteamInputActive => false;

          	public bool RewiredControllerAvailable => false;

          	protected override void AwakeFunction()
          	{
          		base.AwakeFunction();
          		UrpFix.Apply();
          		Debug.Log("Initializing touch input management.");
          		Input.simulateMouseWithTouches = false;
          		Input.multiTouchEnabled = true;
          		circleTex = MakeCircle(64);
          		StartCoroutine(LogDiagnostics());
          	}

          	private IEnumerator LogDiagnostics()
          	{
          		for (int i = 0; i < 12; i++)
          		{
          			yield return new WaitForSecondsRealtime(4f);
          			LogRenderState();
          		}
          	}

          	private void LogRenderState()
          	{
          		string text = "DIAG scene=" + UnityEngine.SceneManagement.SceneManager.GetActiveScene().name + " api=" + SystemInfo.graphicsDeviceType + " screen=" + Screen.width + "x" + Screen.height + " timeScale=" + Time.timeScale;
          		UnityEngine.Rendering.RenderPipelineAsset renderPipelineAsset = UnityEngine.Rendering.GraphicsSettings.renderPipelineAsset;
          		text = text + " pipeline=" + ((renderPipelineAsset == null) ? "none" : renderPipelineAsset.GetType().Name);
          		Debug.Log(text);
          		if (renderPipelineAsset != null)
          		{
          			try
          			{
          				object obj = null;
          				System.Reflection.PropertyInfo property = renderPipelineAsset.GetType().GetProperty("scriptableRenderer", System.Reflection.BindingFlags.Instance | System.Reflection.BindingFlags.Public | System.Reflection.BindingFlags.NonPublic);
          				if (property != null)
          				{
          					obj = property.GetValue(renderPipelineAsset, null);
          				}
          				Debug.Log("DIAG urp renderer=" + ((obj == null) ? "null" : obj.GetType().Name) + " blitShaderFound=" + (Shader.Find("Hidden/Universal Render Pipeline/Blit") != null));
          			}
          			catch (System.Exception ex)
          			{
          				Debug.Log("DIAG urp error " + ex.ToString());
          			}
          		}
          		GlobalCam instance = Singleton<GlobalCam>.Instance;
          		if (instance != null)
          		{
          			Debug.Log("DIAG globalcam transitionActive=" + instance.TransitionActive + " camEnabled=" + instance.Cam.enabled + " renderTexCamEnabled=" + instance.RenderTexCam.enabled);
          			RenderTexture targetTexture = instance.Cam.targetTexture;
          			if (targetTexture != null)
          			{
          				RenderTexture active = RenderTexture.active;
          				RenderTexture.active = targetTexture;
          				Texture2D texture2D = new Texture2D(1, 1, TextureFormat.RGBA32, false);
          				string text6 = "";
          				for (int n = 1; n <= 3; n++)
          				{
          					texture2D.ReadPixels(new Rect(targetTexture.width * n / 4, targetTexture.height / 2, 1f, 1f), 0, 0);
          					texture2D.Apply();
          					text6 = text6 + texture2D.GetPixel(0, 0).ToString() + " ";
          				}
          				RenderTexture.active = active;
          				UnityEngine.Object.Destroy(texture2D);
          				Debug.Log("DIAG rt " + targetTexture.width + "x" + targetTexture.height + " created=" + targetTexture.IsCreated() + " samples=" + text6);
          			}
          		}
          		Canvas[] array = UnityEngine.Object.FindObjectsOfType<Canvas>();
          		for (int k = 0; k < array.Length; k++)
          		{
          			Canvas canvas = array[k];
          			string text3 = (canvas.worldCamera == null) ? "none" : canvas.worldCamera.name;
          			Debug.Log("DIAG canvas " + canvas.name + " mode=" + canvas.renderMode + " enabled=" + canvas.enabled + " order=" + canvas.sortingOrder + " camera=" + text3 + " graphics=" + canvas.GetComponentsInChildren<UnityEngine.UI.Graphic>().Length);
          		}
          		UnityEngine.UI.RawImage[] array2 = UnityEngine.Object.FindObjectsOfType<UnityEngine.UI.RawImage>();
          		for (int m = 0; m < array2.Length; m++)
          		{
          			UnityEngine.UI.RawImage rawImage = array2[m];
          			string text4 = (rawImage.texture == null) ? "none" : (rawImage.texture.name + " " + rawImage.texture.width + "x" + rawImage.texture.height);
          			string text5 = "none";
          			if (rawImage.material != null && rawImage.material.shader != null)
          			{
          				text5 = rawImage.material.shader.name + " supported=" + rawImage.material.shader.isSupported;
          			}
          			Debug.Log("DIAG rawimage " + rawImage.name + " active=" + rawImage.gameObject.activeInHierarchy + " texture=" + text4 + " shader=" + text5 + " color=" + rawImage.color);
          		}
          		Camera[] allCameras = Camera.allCameras;
          		for (int j = 0; j < allCameras.Length; j++)
          		{
          			Camera camera = allCameras[j];
          			string text2 = "screen";
          			if (camera.targetTexture != null)
          			{
          				text2 = camera.targetTexture.width + "x" + camera.targetTexture.height + " " + camera.targetTexture.format;
          			}
          			Debug.Log("DIAG cam " + camera.name + " depth=" + camera.depth + " mask=" + camera.cullingMask + " target=" + text2);
          		}
          	}

          	private static Texture2D MakeCircle(int size)
          	{
          		Texture2D texture2D = new Texture2D(size, size, TextureFormat.RGBA32, false);
          		float num = (float)size / 2f;
          		for (int i = 0; i < size; i++)
          		{
          			for (int j = 0; j < size; j++)
          			{
          				float num2 = (float)j + 0.5f - num;
          				float num3 = (float)i + 0.5f - num;
          				float num4 = Mathf.Sqrt(num2 * num2 + num3 * num3);
          				float a = Mathf.Clamp01(num - num4);
          				texture2D.SetPixel(j, i, new Color(1f, 1f, 1f, a));
          			}
          		}
          		texture2D.Apply();
          		return texture2D;
          	}

          	public void CheckMouseMap()
          	{
          	}

          	private void AddButton(string id, string label, Vector2 center, float radius)
          	{
          		TouchButton item = default(TouchButton);
          		item.id = id;
          		item.label = label;
          		item.center = center;
          		item.radius = radius;
          		buttons.Add(item);
          	}

          	private void BuildButtons()
          	{
          		buttons.Clear();
          		float num = (float)Screen.height / 720f;
          		float num2 = Screen.width;
          		float num3 = Screen.height;
          		if (currentActionSetId == "Interface")
          		{
          			AddButton("MouseSubmit", "CLICK", new Vector2(num2 - 130f * num, 140f * num), 75f * num);
          			AddButton("Pause", "BACK", new Vector2(70f * num, num3 - 70f * num), 45f * num);
          			return;
          		}
          		AddButton("Interact", "USE", new Vector2(num2 - 130f * num, 170f * num), 75f * num);
          		AddButton("UseItem", "ITEM", new Vector2(num2 - 290f * num, 110f * num), 55f * num);
          		AddButton("Run", "RUN", new Vector2(num2 - 110f * num, 340f * num), 55f * num);
          		AddButton("LookBack", "BACK", new Vector2(num2 - 280f * num, 270f * num), 45f * num);
          		AddButton("ItemLeft", "<", new Vector2(num2 * 0.5f - 90f * num, 60f * num), 42f * num);
          		AddButton("ItemRight", ">", new Vector2(num2 * 0.5f + 90f * num, 60f * num), 42f * num);
          		AddButton("Map", "MAP", new Vector2(num2 - 170f * num, num3 - 60f * num), 38f * num);
          		AddButton("Pause", "II", new Vector2(num2 - 60f * num, num3 - 60f * num), 38f * num);
          	}

          	private string HitButton(Vector2 position)
          	{
          		for (int i = 0; i < buttons.Count; i++)
          		{
          			if ((position - buttons[i].center).magnitude <= buttons[i].radius * 1.25f)
          			{
          				return buttons[i].id;
          			}
          		}
          		return null;
          	}

          	private void Update()
          	{
          		if (tapReleasePending)
          		{
          			if (!fingerButtons.ContainsValue("MouseSubmit"))
          			{
          				held.Remove("MouseSubmit");
          			}
          			tapReleasePending = false;
          		}
          		dragDelta = Vector2.zero;
          		BuildButtons();
          		float num = (float)Screen.height / 720f;
          		bool flag = currentActionSetId == "Interface";
          		for (int i = 0; i < Input.touchCount; i++)
          		{
          			Touch touch = Input.GetTouch(i);
          			int fingerId = touch.fingerId;
          			if (touch.phase == TouchPhase.Began)
          			{
          				anyTouchDown = true;
          				string text = HitButton(touch.position);
          				if (text != null)
          				{
          					fingerButtons[fingerId] = text;
          					held.Add(text);
          					down.Add(text);
          				}
          				else if (!flag && joyFinger < 0 && touch.position.x < (float)Screen.width * 0.4f)
          				{
          					joyFinger = fingerId;
          					joyOrigin = touch.position;
          					joyVector = Vector2.zero;
          				}
          				else if (lookFinger < 0)
          				{
          					lookFinger = fingerId;
          					lookStart = touch.position;
          					lookStartTime = Time.unscaledTime;
          				}
          			}
          			else if (touch.phase == TouchPhase.Moved || touch.phase == TouchPhase.Stationary)
          			{
          				if (fingerId == joyFinger)
          				{
          					joyVector = Vector2.ClampMagnitude((touch.position - joyOrigin) / (90f * num), 1f);
          				}
          				else if (fingerId == lookFinger)
          				{
          					dragDelta += touch.deltaPosition;
          				}
          			}
          			else if (touch.phase == TouchPhase.Ended || touch.phase == TouchPhase.Canceled)
          			{
          				string value;
          				if (fingerButtons.TryGetValue(fingerId, out value))
          				{
          					held.Remove(value);
          					fingerButtons.Remove(fingerId);
          				}
          				if (fingerId == joyFinger)
          				{
          					joyFinger = -1;
          					joyVector = Vector2.zero;
          				}
          				if (fingerId == lookFinger)
          				{
          					bool flag2 = Time.unscaledTime - lookStartTime < 0.3f;
          					bool flag3 = (touch.position - lookStart).magnitude < 30f * num;
          					if (touch.phase == TouchPhase.Ended && flag2 && flag3)
          					{
          						held.Add("MouseSubmit");
          						down.Add("MouseSubmit");
          						tapReleasePending = true;
          					}
          					lookFinger = -1;
          				}
          			}
          		}
          		if (Input.touchCount == 0)
          		{
          			fingerButtons.Clear();
          			joyFinger = -1;
          			joyVector = Vector2.zero;
          			lookFinger = -1;
          			List<string> list = new List<string>(held);
          			for (int j = 0; j < list.Count; j++)
          			{
          				if (list[j] != "MouseSubmit" || !tapReleasePending)
          				{
          					held.Remove(list[j]);
          				}
          			}
          		}
          		if (Input.GetKeyDown(KeyCode.Escape))
          		{
          			down.Add("Pause");
          		}
          	}

          	private void LateUpdate()
          	{
          		down.Clear();
          		frameStopped = false;
          		anyTouchDown = false;
          	}

          	public bool GetDigitalInput(string id, bool onDown)
          	{
          		if (inputFrozen || frameStopped)
          		{
          			return false;
          		}
          		if (onDown)
          		{
          			return down.Contains(id);
          		}
          		return held.Contains(id) || down.Contains(id);
          	}

          	public bool AnyButton(bool onDown)
          	{
          		if (inputFrozen || frameStopped)
          		{
          			return false;
          		}
          		if (onDown)
          		{
          			return anyTouchDown || down.Count > 0;
          		}
          		return held.Count > 0 || Input.touchCount > 0;
          	}

          	public void GetAnalogInput(AnalogInputData inputData, out Vector2 analog, out Vector2 delta)
          	{
          		GetAnalogInput(inputData, out analog, out delta, 1f);
          	}

          	public void GetAnalogInput(AnalogInputData inputData, out Vector2 analog, out Vector2 delta, float steamDeltaAdjustment)
          	{
          		analog = Vector2.zero;
          		delta = Vector2.zero;
          		if (inputFrozen || frameStopped || inputData == null)
          		{
          			return;
          		}
          		if (!string.IsNullOrEmpty(inputData.xAnalogId) && inputData.xAnalogId.StartsWith("Movement"))
          		{
          			analog = joyVector;
          		}
          		if (!string.IsNullOrEmpty(inputData.xDeltaId))
          		{
          			if (inputData.xDeltaId.StartsWith("Cursor"))
          			{
          				delta = dragDelta * 0.35f;
          			}
          			else if (inputData.xDeltaId.StartsWith("Camera") || inputData.xDeltaId.StartsWith("Map"))
          			{
          				delta = dragDelta * 0.12f;
          			}
          		}
          	}

