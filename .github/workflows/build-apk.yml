      - name: Patch URP renderer for Android
        run: |
          SCRIPTS=$(find export/ExportedProject/Assets -type d -name "Assembly-CSharp" | head -n 1)
          test -n "$SCRIPTS" || { echo "ERROR: scripts folder not found"; exit 1; }
          cat > "$SCRIPTS/UrpFix.cs" << 'EOF_CS'
          using System;
          using System.Reflection;
          using UnityEngine;
          using UnityEngine.Rendering;

          // Rebuilds the URP renderer at startup. The exported renderer asset cannot be loaded on Android,
          // so the pipeline has no renderer and draws nothing. This creates a new one in code.
          public static class UrpFix
          {
          	private const BindingFlags All = BindingFlags.Instance | BindingFlags.Static | BindingFlags.Public | BindingFlags.NonPublic;

          	private static bool applied;

          	[RuntimeInitializeOnLoadMethod(RuntimeInitializeLoadType.BeforeSceneLoad)]
          	private static void Init()
          	{
          		Apply();
          	}

          	public static void Apply()
          	{
          		if (applied)
          		{
          			return;
          		}
          		applied = true;
          		try
          		{
          			RenderPipelineAsset renderPipelineAsset = GraphicsSettings.renderPipelineAsset;
          			if (renderPipelineAsset == null)
          			{
          				Debug.Log("URPFIX: no render pipeline asset");
          				return;
          			}
          			Type type = renderPipelineAsset.GetType();
          			FieldInfo field = type.GetField("m_RendererDataList", All);
          			if (field == null)
          			{
          				Debug.Log("URPFIX: m_RendererDataList not found");
          				return;
          			}
          			int num = 0;
          			FieldInfo field2 = type.GetField("m_DefaultRendererIndex", All);
          			if (field2 != null)
          			{
          				num = (int)field2.GetValue(renderPipelineAsset);
          			}
          			Array array = field.GetValue(renderPipelineAsset) as Array;
          			if (array != null && array.Length > num && array.GetValue(num) != null)
          			{
          				Debug.Log("URPFIX: renderer data already present");
          				return;
          			}
          			Type type2 = type.Assembly.GetType("UnityEngine.Rendering.Universal.ForwardRendererData");
          			if (type2 == null)
          			{
          				Debug.Log("URPFIX: ForwardRendererData type not found");
          				return;
          			}
          			ScriptableObject scriptableObject = ScriptableObject.CreateInstance(type2);
          			FillShaders(scriptableObject, type2.GetField("shaders", All));
          			FieldInfo field3 = type2.GetField("postProcessData", All);
          			if (field3 != null)
          			{
          				ScriptableObject scriptableObject2 = ScriptableObject.CreateInstance(field3.FieldType);
          				FillShaders(scriptableObject2, field3.FieldType.GetField("shaders", All));
          				FieldInfo field4 = field3.FieldType.GetField("textures", All);
          				if (field4 != null && field4.GetValue(scriptableObject2) == null)
          				{
          					field4.SetValue(scriptableObject2, Activator.CreateInstance(field4.FieldType));
          				}
          				field3.SetValue(scriptableObject, scriptableObject2);
          			}
          			FieldInfo field5 = type2.GetField("xrSystemData", All);
          			if (field5 != null)
          			{
          				ScriptableObject scriptableObject3 = ScriptableObject.CreateInstance(field5.FieldType);
          				FillShaders(scriptableObject3, field5.FieldType.GetField("shaders", All));
          				field5.SetValue(scriptableObject, scriptableObject3);
          			}
          			int num2 = Math.Max(1, (array == null) ? 1 : array.Length);
          			if (num >= num2)
          			{
          				num2 = num + 1;
          			}
          			Array array2 = Array.CreateInstance(field.FieldType.GetElementType(), num2);
          			if (array != null)
          			{
          				Array.Copy(array, array2, array.Length);
          			}
          			array2.SetValue(scriptableObject, num);
          			field.SetValue(renderPipelineAsset, array2);
          			Debug.Log("URPFIX: created a new renderer data at index " + num);
          		}
          		catch (Exception ex)
          		{
          			Debug.Log("URPFIX: error " + ex);
          		}
          	}

          	private static void FillShaders(object owner, FieldInfo shadersField)
          	{
          		if (shadersField == null)
          		{
          			return;
          		}
          		object obj = shadersField.GetValue(owner);
          		if (obj == null)
          		{
          			obj = Activator.CreateInstance(shadersField.FieldType);
          		}
          		FieldInfo[] fields = obj.GetType().GetFields(BindingFlags.Instance | BindingFlags.Public | BindingFlags.NonPublic);
          		for (int i = 0; i < fields.Length; i++)
          		{
          			if (fields[i].FieldType == typeof(Shader))
          			{
          				string text = ShaderName(fields[i].Name);
          				Shader shader = null;
          				if (text != null)
          				{
          					shader = Shader.Find(text);
          				}
          				if (shader == null)
          				{
          					if (text != null)
          					{
          						Debug.Log("URPFIX: shader not found, using a stand-in for " + text);
          					}
          					shader = GetFallback();
          				}
          				fields[i].SetValue(obj, shader);
          			}
          		}
          		shadersField.SetValue(owner, obj);
          	}

          	private static Shader fallbackShader;

          	private static Shader GetFallback()
          	{
          		if (fallbackShader == null)
          		{
          			fallbackShader = Shader.Find("Hidden/Universal Render Pipeline/Blit");
          		}
          		if (fallbackShader == null)
          		{
          			fallbackShader = Shader.Find("Sprites/Default");
          		}
          		if (fallbackShader == null)
          		{
          			fallbackShader = Shader.Find("UI/Default");
          		}
          		return fallbackShader;
          	}

          	private static string ShaderName(string field)
          	{
          		string text = "Hidden/Universal Render Pipeline/";
          		switch (field)
          		{
          		case "blitPS":
          			return text + "Blit";
          		case "copyDepthPS":
          			return text + "CopyDepth";
          		case "screenSpaceShadowPS":
          			return text + "ScreenSpaceShadows";
          		case "samplingPS":
          			return text + "Sampling";
          		case "stencilDeferredPS":
          			return text + "StencilDeferred";
          		case "fallbackErrorPS":
          			return text + "FallbackError";
          		case "materialErrorPS":
          			return text + "MaterialError";
          		case "stopNanPS":
          			return text + "Stop NaN";
          		case "subpixelMorphologicalAntialiasingPS":
          			return text + "SubpixelMorphologicalAntialiasing";
          		case "gaussianDepthOfFieldPS":
          			return text + "GaussianDepthOfField";
          		case "bokehDepthOfFieldPS":
          			return text + "BokehDepthOfField";
          		case "cameraMotionBlurPS":
          			return text + "CameraMotionBlur";
          		case "paniniProjectionPS":
          			return text + "PaniniProjection";
          		case "lutBuilderLdrPS":
          			return text + "LutBuilderLdr";
          		case "lutBuilderHdrPS":
          			return text + "LutBuilderHdr";
          		case "bloomPS":
          			return text + "Bloom";
          		case "uberPostPS":
          			return text + "UberPost";
          		case "finalPostPS":
          			return text + "FinalPost";
          		case "xrOcclusionMeshPS":
          			return text + "XR/XROcclusionMesh";
          		case "xrMirrorViewPS":
          			return text + "XR/XRMirrorView";
          		default:
          			return null;
          		}
          	}
          }
          EOF_CS
          cat > blit.shader << 'EOF_SHADER'
          Shader "Hidden/Universal Render Pipeline/Blit"
          {
          	Properties
          	{
          	}
          	SubShader
          	{
          		Tags { "RenderType" = "Opaque" "RenderPipeline" = "UniversalPipeline" }
          		LOD 100

          		Pass
          		{
          			Name "Blit"
          			ZTest Always
          			ZWrite Off
          			Cull Off

          			HLSLPROGRAM
          			#pragma vertex Vert
          			#pragma fragment Frag
          			#pragma multi_compile _ _USE_DRAW_PROCEDURAL
          			#pragma multi_compile_fragment _ _LINEAR_TO_SRGB_CONVERSION

          			Texture2D _SourceTex;
          			SamplerState sampler_SourceTex;
          			float4 _ScaleBias;

          			struct Attributes
          			{
          			#if _USE_DRAW_PROCEDURAL
          				uint vertexID : SV_VertexID;
          			#else
          				float4 pos : POSITION;
          				float2 uv : TEXCOORD0;
          			#endif
          			};

          			struct Varyings
          			{
          				float4 pos : SV_POSITION;
          				float2 uv : TEXCOORD0;
          			};

          			Varyings Vert(Attributes input)
          			{
          				Varyings output;
          			#if _USE_DRAW_PROCEDURAL
          				float2 t = float2((input.vertexID << 1) & 2, input.vertexID & 2);
          				output.pos = float4(t * 2.0 - 1.0, 0.0, 1.0);
          				output.uv = float2(t.x, 1.0 - t.y) * _ScaleBias.xy + _ScaleBias.zw;
          			#else
          				output.pos = float4(input.pos.xy, 0.0, 1.0);
          				output.uv = input.uv;
          			#endif
          				return output;
          			}

          			float4 Frag(Varyings input) : SV_Target
          			{
          				float4 col = _SourceTex.Sample(sampler_SourceTex, input.uv);
          			#ifdef _LINEAR_TO_SRGB_CONVERSION
          				col.rgb = pow(max(col.rgb, 0.0), 1.0 / 2.2);
          			#endif
          				return col;
          			}
          			ENDHLSL
          		}
          	}
          }
