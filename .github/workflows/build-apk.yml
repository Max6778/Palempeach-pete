          			Varyings vert(Attributes input)
          			{
          				Varyings output;
          				output.pos = mul(unity_MatrixVP, mul(unity_ObjectToWorld, input.pos));
          				output.color = input.color * _FaceColor;
          				output.uv = input.uv;
          				return output;
          			}

          			float4 frag(Varyings input) : SV_Target
          			{
          				float4 c = input.color;
          				c.a = c.a * _MainTex.Sample(sampler_MainTex, input.uv).a;
          				return c;
          			}
          			ENDHLSL
          		}
          	}
          }
          """ % (STENCIL_PROPS, TMP_STATE, HEAD_DECL)


          def tmp_sprite():
              return """Shader "TextMeshPro/Sprite"
          {
          	Properties
          	{
          		_MainTex ("Sprite Texture", 2D) = "white" {}
          		_Color ("Tint", Vector) = (1,1,1,1)
          %s	}
          	SubShader
          	{
          %s		Pass
          		{
          			Blend SrcAlpha OneMinusSrcAlpha
          			HLSLPROGRAM
          			#pragma vertex vert
          			#pragma fragment frag

          %s
          			Texture2D _MainTex;
          			SamplerState sampler_MainTex;
          			float4 _Color;

          			struct Attributes
          			{
          				float4 pos : POSITION;
          				float4 color : COLOR;
          				float2 uv : TEXCOORD0;
          			};

          			struct Varyings
          			{
          				float4 pos : SV_POSITION;
          				float4 color : COLOR;
          				float2 uv : TEXCOORD0;
          			};

          			Varyings vert(Attributes input)
          			{
          				Varyings output;
          				output.pos = mul(unity_MatrixVP, mul(unity_ObjectToWorld, input.pos));
          				output.color = input.color * _Color;
          				output.uv = input.uv;
          				return output;
          			}

          			float4 frag(Varyings input) : SV_Target
          			{
          				return _MainTex.Sample(sampler_MainTex, input.uv) * input.color;
          			}
          			ENDHLSL
          		}
          	}
          }
          """ % (STENCIL_PROPS, TMP_STATE, HEAD_DECL)


          def tmp_sdf_mobile():
              return """Shader "TextMeshPro/Mobile/Distance Field"
          {
          	Properties
          	{
          		_FaceColor ("Face Color", Vector) = (1,1,1,1)
          		_FaceDilate ("Face Dilate", Range(-1, 1)) = 0
          		_OutlineColor ("Outline Color", Vector) = (0,0,0,1)
          		_OutlineWidth ("Outline Thickness", Range(0, 1)) = 0
          		_OutlineSoftness ("Outline Softness", Range(0, 1)) = 0
          		_UnderlayColor ("Border Color", Vector) = (0,0,0,0.5)
          		_UnderlayOffsetX ("Border OffsetX", Range(-1, 1)) = 0
          		_UnderlayOffsetY ("Border OffsetY", Range(-1, 1)) = 0
          		_UnderlayDilate ("Border Dilate", Range(-1, 1)) = 0
          		_UnderlaySoftness ("Border Softness", Range(0, 1)) = 0
          		_WeightNormal ("Weight Normal", Float) = 0
          		_WeightBold ("Weight Bold", Float) = 0.5
          		_ScaleRatioA ("Scale RatioA", Float) = 1
          		_ScaleRatioB ("Scale RatioB", Float) = 1
          		_ScaleRatioC ("Scale RatioC", Float) = 1
          		_MainTex ("Font Atlas", 2D) = "white" {}
          		_TextureWidth ("Texture Width", Float) = 512
          		_TextureHeight ("Texture Height", Float) = 512
          		_GradientScale ("Gradient Scale", Float) = 5
          		_VertexOffsetX ("Vertex OffsetX", Float) = 0
          		_VertexOffsetY ("Vertex OffsetY", Float) = 0
          %s	}
          	SubShader
          	{
          %s		Pass
          		{
          			Blend One OneMinusSrcAlpha
          			HLSLPROGRAM
          			#pragma vertex vert
          			#pragma fragment frag
          			#pragma shader_feature_local OUTLINE_ON
          			#pragma shader_feature_local UNDERLAY_ON

          %s
          			Texture2D _MainTex;
          			SamplerState sampler_MainTex;
          			float4 _FaceColor;
          			float _FaceDilate;
          			float4 _OutlineColor;
          			float _OutlineWidth;
          			float4 _UnderlayColor;
          			float _UnderlayOffsetX;
          			float _UnderlayOffsetY;
          			float _UnderlayDilate;
          			float _WeightNormal;
          			float _WeightBold;
          			float _ScaleRatioA;
          			float _ScaleRatioC;
          			float _TextureWidth;
          			float _TextureHeight;
          			float _GradientScale;
          			float _VertexOffsetX;
          			float _VertexOffsetY;

          			struct Attributes
          			{
          				float4 pos : POSITION;
          				float4 color : COLOR;
          				float2 uv : TEXCOORD0;
          				float2 uv1 : TEXCOORD1;
          			};

          			struct Varyings
          			{
          				float4 pos : SV_POSITION;
          				float4 color : COLOR;
          				float2 uv : TEXCOORD0;
          				float bold : TEXCOORD1;
          			};

          			Varyings vert(Attributes input)
          			{
          				Varyings output;
          				float4 p = input.pos;
          				p.x += _VertexOffsetX;
          				p.y += _VertexOffsetY;
          				output.pos = mul(unity_MatrixVP, mul(unity_ObjectToWorld, p));
          				output.color = input.color * _FaceColor;
          				output.uv = input.uv;
          				output.bold = step(input.uv1.y, 0.0);
          				return output;
          			}

          			float4 frag(Varyings input) : SV_Target
          			{
          				float a = _MainTex.Sample(sampler_MainTex, input.uv).a;
          				float w = max(fwidth(a), 0.0001);
          				float weight = (lerp(_WeightNormal, _WeightBold, input.bold) / 4.0 + _FaceDilate) * _ScaleRatioA * 0.5;
          				float threshold = 0.5 - weight;
          				float face = saturate((a - threshold) / w + 0.5);
          				float4 faceColor = input.color;
          				float4 c = float4(faceColor.rgb, faceColor.a * face);
          			#if defined(OUTLINE_ON)
          				float ow = _OutlineWidth * _ScaleRatioA * 0.5;
          				float outer = saturate((a - (threshold - ow)) / w + 0.5);
          				c.rgb = lerp(_OutlineColor.rgb, faceColor.rgb, face);
          				c.a = lerp(_OutlineColor.a, faceColor.a, face) * outer;
          			#endif
          				float4 result = float4(c.rgb * c.a, c.a);
          			#if defined(UNDERLAY_ON)
          				float2 off = float2(_UnderlayOffsetX, _UnderlayOffsetY) * _GradientScale / float2(max(_TextureWidth, 1.0), max(_TextureHeight, 1.0));
          				float a2 = _MainTex.Sample(sampler_MainTex, input.uv - off).a;
          				float w2 = max(fwidth(a2), 0.0001);
          				float shadow = saturate((a2 - (0.5 - _UnderlayDilate * _ScaleRatioC * 0.5)) / w2 + 0.5);
          				float sa = _UnderlayColor.a * shadow;
          				float4 under = float4(_UnderlayColor.rgb * sa, sa);
          				result = result + under * (1.0 - result.a);
          			#endif
          				return result;
          			}
          			ENDHLSL
          		}
          	}
          }
          """ % (STENCIL_PROPS, TMP_STATE, HEAD_DECL)


          SHADERS = {
              "Shader/Shader Graphs_Standard.shader": standard("Shader Graphs/Standard", True, True, "keyword"),
              "Shader/Shader Graphs_TileStandard.shader": standard("Shader Graphs/TileStandard", False, False, "none"),
              "Shader/Shader Graphs_TileStandard_AlphaClip.shader": standard("Shader Graphs/TileStandard_AlphaClip", False, False, "always"),
              "Shader/Shader Graphs_TileStandardWPoster.shader": standard("Shader Graphs/TileStandardWPoster", False, False, "none"),
              "Shader/Shader Graphs_TileStandardWPoster_AlphaClip.shader": standard("Shader Graphs/TileStandardWPoster_AlphaClip", False, False, "always"),
              "Shader/Shader Graphs_SpriteStandard.shader": sprite("Shader Graphs/SpriteStandard"),
              "Shader/SpriteStandard_NoBatching.shader": sprite("SpriteStandard_NoBatching"),
              "Shader/Shader Graphs_MaskedStandard.shader": masked_standard(),
              "Shader/Masked_Mask.shader": depth_mask(),
              "Shader/Shader Graphs_MapTile.shader": map_tile(),
              "Shader/Shader Graphs_Particle.shader": particle(),
              "Shader/Shader Graphs_Polygon.shader": polygon(),
              "Shader/Shader Graphs_Skybox.shader": standard("Shader Graphs/Skybox", True, True, "none"),
              "Resources/shaders/tmp_bitmap.shader": tmp_bitmap(),
              "Resources/shaders/tmp_sprite.shader": tmp_sprite(),
              "Resources/shaders/tmp_sdf-mobile.shader": tmp_sdf_mobile(),
          }

          done = 0
          for rel, text in SHADERS.items():
              path = os.path.join(ROOT, rel)
              if not os.path.isfile(path):
                  # fall back to searching by file name
                  found = None
                  for dp, dn, fn in os.walk(ROOT):
                      if os.path.basename(rel) in fn:
                          found = os.path.join(dp, os.path.basename(rel))
                          break
                  if found is None:
                      print("WARNING: not found:", rel)
                      continue
                  path = found
              open(path, "w").write(text)
              done += 1
          print("Replaced %d of %d shaders" % (done, len(SHADERS)))
          EOF_PY
          python3 write_shaders.py

      - name: Add build script
        run: |
          mkdir -p export/ExportedProject/Assets/Editor
          cat > export/ExportedProject/Assets/Editor/CIBuild.cs << 'EOF'
          using System;
          using System.Collections.Generic;
          using System.IO;
          using UnityEditor;
          using UnityEditor.Build.Reporting;

          public static class CIBuild
          {
              public static void BuildAndroid()
              {
                  var scenes = new List<string>();
                  foreach (var s in EditorBuildSettings.scenes)
                      if (s.enabled) scenes.Add(s.path);
                  Console.WriteLine("CIBuild: scenes in build = " + scenes.Count);
                  if (scenes.Count == 0)
                  {
                      Console.WriteLine("CIBuild: no scenes found, aborting");
                      EditorApplication.Exit(2);
                      return;
                  }

                  PlayerSettings.SetApplicationIdentifier(BuildTargetGroup.Android, "com.epic.gameport");
                  PlayerSettings.Android.bundleVersionCode = 1;
                  PlayerSettings.bundleVersion = "1.0";
                  PlayerSettings.SetScriptingBackend(BuildTargetGroup.Android, ScriptingImplementation.Mono2x);
                  PlayerSettings.Android.targetArchitectures = AndroidArchitecture.ARMv7;
                  PlayerSettings.Android.minSdkVersion = AndroidSdkVersions.AndroidApiLevel22;
                  EditorUserBuildSettings.buildAppBundle = false;

                  string outPath = Environment.GetEnvironmentVariable("APK_OUT");
                  if (string.IsNullOrEmpty(outPath)) outPath = Path.GetFullPath("game.apk");
                  Directory.CreateDirectory(Path.GetDirectoryName(outPath));

                  var options = new BuildPlayerOptions
                  {
                      scenes = scenes.ToArray(),
                      locationPathName = outPath,
                      target = BuildTarget.Android,
                      options = BuildOptions.None
                  };
                  var report = BuildPipeline.BuildPlayer(options);
                  Console.WriteLine("CIBuild: result = " + report.summary.result);
                  if (report.summary.result != BuildResult.Succeeded)
                      EditorApplication.Exit(1);
              }
          }
          EOF

      - name: Build APK
        run: |
          EDITOR="$UNITY_EDITOR_PATH"
          if [ -d "$EDITOR" ]; then
            EDITOR=$(find "$EDITOR" -maxdepth 3 -type f -name Unity | head -n 1)
          fi
          echo "Using editor: $EDITOR"
          test -x "$EDITOR" || { echo "ERROR: Unity editor not found"; exit 1; }
          export APK_OUT="$PWD/apk/game.apk"
          "$EDITOR" -batchmode -nographics -quit \
            -projectPath "$PWD/export/ExportedProject" \
            -buildTarget Android \
            -executeMethod CIBuild.BuildAndroid \
            -logFile "$PWD/unity.log"
          test -f "$APK_OUT" || { echo "ERROR: APK was not created"; exit 1; }
          ls -lh "$APK_OUT"

      - name: Show Unity errors
        if: always()
        run: |
          grep -E "error CS|Shader error|CIBuild:|Build Finished|Error building|BuildFailed|Gradle build failed" unity.log | sort -u | head -n 60 || true
          tail -n 30 unity.log || true

      - name: Publish APK and log to a release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="unity.log"
          if [ -f apk/game.apk ]; then FILES="apk/game.apk unity.log"; fi
          gh release create "build-${{ github.run_number }}" $FILES --repo ${{ github.repository }} --title "Build ${{ github.run_number }}" --notes "Android build"

      - name: Upload Unity log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: unity-log
          path: unity.log
          if-no-files-found: ignore
