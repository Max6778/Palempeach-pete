          			HLSLPROGRAM
          			#pragma vertex vert
          			#pragma fragment frag
          			#pragma shader_feature_local BOOLEAN_BILLBOARD_ON
                      #pragma multi_compile _ ETC1_EXTERNAL_ALPHA

          %s
          			float3 _WorldSpaceCameraPos;
          			Texture2D _MainTex;
          			SamplerState sampler_MainTex;
                      Texture2D _AlphaTex;
                      SamplerState sampler_AlphaTex;
          			float4 _Color;
          			float _ColorMultiplier;
          			float _Cutoff;

          			struct Attributes
          			{
          				float4 pos : POSITION;
          				float2 uv : TEXCOORD0;
          			};

          			struct Varyings
          			{
          				float4 pos : SV_POSITION;
          				float2 uv : TEXCOORD0;
          			};

          			Varyings vert(Attributes input)
          			{
          				Varyings output;
          			#if defined(BOOLEAN_BILLBOARD_ON)
          				float3 center = float3(unity_ObjectToWorld[0][3], unity_ObjectToWorld[1][3], unity_ObjectToWorld[2][3]);
          				float sx = length(float3(unity_ObjectToWorld[0][0], unity_ObjectToWorld[1][0], unity_ObjectToWorld[2][0]));
          				float sy = length(float3(unity_ObjectToWorld[0][1], unity_ObjectToWorld[1][1], unity_ObjectToWorld[2][1]));
          				float3 toCam = float3(_WorldSpaceCameraPos.x - center.x, 0.0, _WorldSpaceCameraPos.z - center.z);
          				toCam = normalize(toCam + float3(0.0, 0.0, 0.0001));
          				float3 rightDir = normalize(cross(float3(0.0, 1.0, 0.0), toCam));
          				float3 worldPos = center + rightDir * (input.pos.x * sx) + float3(0.0, 1.0, 0.0) * (input.pos.y * sy);
