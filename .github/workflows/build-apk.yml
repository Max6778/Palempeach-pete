      - name: Resolve Unity packages for Family Time
        if: ${{ env.GAME_KEY == 'family_time' && inputs.real_packages }}
        run: |
          # Let Unity itself download and resolve the real packages in an empty project.
          # Its package cache is then used to replace the game's cut-down copies.
          mkdir -p pkgproj/Assets pkgproj/Packages pkgproj/ProjectSettings
          echo "m_EditorVersion: $UNITY_VER" > pkgproj/ProjectSettings/ProjectVersion.txt
          cat > pkgproj/Packages/manifest.json << 'EOF_MANIFEST'
          {
            "dependencies": {
              "com.unity.render-pipelines.universal": "17.2.0",
              "com.unity.visualeffectgraph": "17.2.0",
              "com.unity.inputsystem": "1.14.0",
              "com.unity.ugui": "2.0.0"
            }
          }
          EOF_MANIFEST
          "$UNITY_EDITOR_PATH" -batchmode -nographics -quit -projectPath "$PWD/pkgproj" -logFile "$PWD/pkg_resolve.log" || true
          grep -iE "error|cannot be found|invalid" pkg_resolve.log | head -n 20 || true
          echo "--- resolved packages ---"
          ls pkgproj/Library/PackageCache 2>/dev/null || echo "(none)"
          if [ -d pkgproj/Library/PackageCache ]; then
            echo "PKG_CACHE=$PWD/pkgproj/Library/PackageCache" >> "$GITHUB_ENV"
          fi
          grep -E '"com.unity' pkgproj/Packages/packages-lock.json 2>/dev/null | head -n 40 || true

      - name: Use the real Unity packages for Family Time
        if: ${{ env.GAME_KEY == 'family_time' && inputs.real_packages }}
        run: |
          cat > remap_ft.py << 'EOF_REMAP'
          import io, json, os, re, shutil, sys, tarfile, urllib.request, collections

          proj = os.environ.get("PROJ", "export/ExportedProject")
          assets = proj + "/Assets"
          plugins = assets + "/Plugins"
          WORK = os.environ.get("WORK", "pkgwork")

          # ---------------------------------------------------------------- MD4 (for Unity script file IDs)
          def _lrot(x, n):
              return ((x << n) | (x >> (32 - n))) & 0xffffffff

          def md4(data):
              import struct
              msg = bytearray(data)
              ml = len(msg) * 8
              msg.append(0x80)
              while len(msg) % 64 != 56:
                  msg.append(0)
              msg += struct.pack("<Q", ml)
              a, b, c, d = 0x67452301, 0xefcdab89, 0x98badcfe, 0x10325476
              F = lambda x, y, z: (x & y) | (~x & z)
              G = lambda x, y, z: (x & y) | (x & z) | (y & z)
              H = lambda x, y, z: x ^ y ^ z
              for off in range(0, len(msg), 64):
                  X = list(struct.unpack("<16I", msg[off:off + 64]))
                  aa, bb, cc, dd = a, b, c, d
                  for i in range(16):
                      s = [3, 7, 11, 19][i % 4]
                      t = (a + F(b, c, d) + X[i]) & 0xffffffff
                      a, b, c, d = d, _lrot(t, s), b, c
                  for i in range(16):
                      k = (i % 4) * 4 + i // 4
                      s = [3, 5, 9, 13][i % 4]
                      t = (a + G(b, c, d) + X[k] + 0x5a827999) & 0xffffffff
                      a, b, c, d = d, _lrot(t, s), b, c
                  order = [0, 8, 4, 12, 2, 10, 6, 14, 1, 9, 5, 13, 3, 11, 7, 15]
                  for i in range(16):
                      k = order[i]
                      s = [3, 9, 11, 15][i % 4]
                      t = (a + H(b, c, d) + X[k] + 0x6ed9eba1) & 0xffffffff
                      a, b, c, d = d, _lrot(t, s), b, c
                  a = (a + aa) & 0xffffffff
                  b = (b + bb) & 0xffffffff
                  c = (c + cc) & 0xffffffff
                  d = (d + dd) & 0xffffffff
              return struct.pack("<4I", a, b, c, d)

          def file_id(ns, name):
              h = md4(b"s\0\0\0" + (ns + name).encode())
              r = 0
              for i in range(3, -1, -1):
                  r = (r << 8) | h[i]
              if r >= 2 ** 31:
                  r -= 2 ** 32
              return r

          # ---------------------------------------------------------------- download packages
          PACKAGES = [
              ("com.unity.render-pipelines.core", "17.2.0"),
              ("com.unity.render-pipelines.universal", "17.2.0"),
              ("com.unity.visualeffectgraph", "17.2.0"),
              ("com.unity.ugui", "2.0.0"),
              ("com.unity.inputsystem", "1.14.0"),
          ]

          def download(name, ver, dest):
              url = None
              try:
                  req = urllib.request.Request("https://packages.unity.com/" + name, headers={"Accept": "application/json"})
                  data = json.load(urllib.request.urlopen(req, timeout=60))
                  url = data["versions"][ver]["dist"]["tarball"]
              except Exception as e:
                  print("  registry lookup failed:", e)
              urls = [u for u in [url, "https://download.packages.unity.com/%s/-/%s-%s.tgz" % (name, name, ver)] if u]
              for u in urls:
                  try:
                      raw = urllib.request.urlopen(u, timeout=300).read()
                      tf = tarfile.open(fileobj=io.BytesIO(raw), mode="r:gz")
                      os.makedirs(dest, exist_ok=True)
                      n = 0
                      for m in tf.getmembers():
                          if not m.isfile():
                              continue
                          parts = m.name.split("/")[1:]
                          if not parts or ".." in parts or m.name.startswith("/"):
                              continue
                          out = os.path.join(dest, *parts)
                          os.makedirs(os.path.dirname(out), exist_ok=True)
                          with open(out, "wb") as f:
                              f.write(tf.extractfile(m).read())
                          n += 1
                      print("  downloaded", name, ver, "(", n, "files ) from", u)
                      return True
                  except Exception as e:
                      print("  download failed from", u, ":", e)
              return False

          def guid_of(meta_path):
              try:
                  for line in open(meta_path, errors="ignore"):
                      if line.startswith("guid:"):
                          return line.split(":", 1)[1].strip()
              except OSError:
                  pass
              return None

          # ---------------------------------------------------------------- scan package sources
          def strip_comments(t):
              t = re.sub(r"/\*.*?\*/", "", t, flags=re.S)
              return re.sub(r"//[^\n]*", "", t)

          def scan(pkg_dirs):
              asm_scripts = collections.defaultdict(dict)   # assembly -> {(ns, cls): guid}
              shaders = {}                                    # shader name -> guid
              computes = {}                                   # compute name -> guid
              for pdir in pkg_dirs:
                  asmdirs = {}
                  for root, dirs, files in os.walk(pdir):
                      for f in files:
                          if f.endswith(".asmdef"):
                              try:
                                  asmdirs[root] = json.load(open(os.path.join(root, f), errors="ignore"))["name"]
                              except Exception:
                                  pass
                  for root, dirs, files in os.walk(pdir):
                      for f in files:
                          path = os.path.join(root, f)
                          g = guid_of(path + ".meta")
                          if not g:
                              continue
                          if f.endswith(".cs"):
                              d = root
                              asm = None
                              while d.startswith(pdir):
                                  if d in asmdirs:
                                      asm = asmdirs[d]
                                      break
                                  if d == pdir:
                                      break
                                  d = os.path.dirname(d)
                              if not asm:
                                  continue
                              stem = f[:-3]
                              text = strip_comments(open(path, errors="ignore").read())
                              cm = re.search(r"\bclass\s+" + re.escape(stem) + r"\b", text)
                              if not cm:
                                  continue
                              ns = ""
                              for nm in re.finditer(r"^\s*namespace\s+([\w\.]+)", text[:cm.start()], re.M):
                                  ns = nm.group(1)
                              asm_scripts[asm][(ns, stem)] = g
                          elif f.endswith(".shader"):
                              m = re.search(r'^\s*Shader\s+"([^"]+)"', open(path, errors="ignore").read(), re.M)
                              if m:
                                  shaders[m.group(1)] = g
                          elif f.endswith(".compute"):
                              computes[f[:-8]] = g
              return asm_scripts, shaders, computes

          def yaml_files():
              for root, dirs, files in os.walk(assets):
                  for f in files:
                      if f.endswith((".asset", ".prefab", ".unity", ".mat", ".controller", ".anim", ".overrideController", ".playable", ".mask", ".flare", ".preset")):
                          yield os.path.join(root, f)

          REF = re.compile(r"\{fileID: (-?\d+), guid: ([0-9a-f]{32}), type: (\d)\}")

          def process(pkg_dirs):
              asm_scripts, pkg_shaders, pkg_computes = scan(pkg_dirs)
              print("package scan: assemblies", len(asm_scripts), "shaders", len(pkg_shaders), "compute", len(pkg_computes))

              # stripped DLLs that a package now provides
              script_map = {}      # (dll guid, fileID) -> package script guid
              dll_guid_to_name = {}
              removable = []
              for dll in sorted(os.listdir(plugins)) if os.path.isdir(plugins) else []:
                  if not dll.endswith(".dll"):
                      continue
                  asm = dll[:-4]
                  if asm not in asm_scripts:
                      continue
                  g = guid_of(os.path.join(plugins, dll + ".meta"))
                  if not g:
                      continue
                  dll_guid_to_name[g] = asm
                  removable.append(dll)
                  for (ns, cls), pg in asm_scripts[asm].items():
                      script_map[(g, file_id(ns, cls))] = pg
                  print("  replace", asm, "->", len(asm_scripts[asm]), "scripts")

              # stub shaders / computes that a package now provides
              shader_map = {}
              stub_files = []
              for f in os.listdir(assets + "/Shader") if os.path.isdir(assets + "/Shader") else []:
                  if not f.endswith(".shader"):
                      continue
                  path = assets + "/Shader/" + f
                  m = re.search(r'^\s*Shader\s+"([^"]+)"', open(path, errors="ignore").read(), re.M)
                  g = guid_of(path + ".meta")
                  if m and g and m.group(1) in pkg_shaders:
                      shader_map[g] = pkg_shaders[m.group(1)]
                      stub_files.append(path)
              compute_map = {}
              for f in os.listdir(assets + "/ComputeShader") if os.path.isdir(assets + "/ComputeShader") else []:
                  if not f.endswith(".asset"):
                      continue
                  stem = f[:-6]
                  path = assets + "/ComputeShader/" + f
                  g = guid_of(path + ".meta")
                  if g and stem in pkg_computes:
                      compute_map[g] = pkg_computes[stem]
                      stub_files.append(path)
              print("  stub shaders replaced by package shaders:", len(shader_map), " compute:", len(compute_map))

              unmapped = collections.Counter()
              changed = 0
              for path in yaml_files():
                  try:
                      t = open(path, errors="ignore").read()
                  except OSError:
                      continue
                  if "guid:" not in t:
                      continue
                  def sub(m):
                      fid, g, typ = m.group(1), m.group(2), m.group(3)
                      if g in dll_guid_to_name:
                          new = script_map.get((g, int(fid)))
                          if new:
                              return "{fileID: 11500000, guid: %s, type: 3}" % new
                          unmapped[(dll_guid_to_name[g], fid)] += 1
                          return m.group(0)
                      if g in shader_map:
                          return "{fileID: %s, guid: %s, type: %s}" % (fid, shader_map[g], typ)
                      if g in compute_map:
                          return "{fileID: %s, guid: %s, type: %s}" % (fid, compute_map[g], typ)
                      return m.group(0)
                  t2 = REF.sub(sub, t)
                  if t2 != t:
                      open(path, "w").write(t2)
                      changed += 1
              print("  rewrote references in", changed, "files")
              if unmapped:
                  print("  WARNING: references that could not be mapped (class not found in package):")
                  for k, v in unmapped.most_common(15):
                      print("    ", k, "x", v)

              # remove the stripped DLLs and the stub files that are now provided by packages
              for dll in removable:
                  for ext in ("", ".meta"):
                      p = os.path.join(plugins, dll + ext)
                      if os.path.exists(p):
                          os.remove(p)
              for p in stub_files:
                  for ext in ("", ".meta"):
                      if os.path.exists(p + ext):
                          os.remove(p + ext)
              print("  removed", len(removable), "stripped DLLs and", len(stub_files), "stub files")
              return len(removable)

          def find_builtin_dir():
              import glob
              cands = []
              ed = os.environ.get("UNITY_EDITOR_PATH", "")
              while ed and ed != "/":
                  cands.append(ed + "/Data/Resources/PackageManager/BuiltInPackages")
                  cands.append(ed + "/Editor/Data/Resources/PackageManager/BuiltInPackages")
                  ed = os.path.dirname(ed)
              cands += glob.glob(os.path.expanduser("~/Unity/Hub/Editor/*/Editor/Data/Resources/PackageManager/BuiltInPackages"))
              for c in cands:
                  if os.path.isdir(c):
                      return c
              return None

          if __name__ == "__main__":
              import glob
              dirs = []
              # 1. packages that Unity itself resolved (best: exactly what the editor would use)
              cache = os.environ.get("PKG_CACHE", "")
              if cache and os.path.isdir(cache):
                  for d in sorted(glob.glob(cache + "/*@*")):
                      print("package from Unity's cache:", os.path.basename(d))
                      dirs.append(d)
              # 2. packages that are built into the editor (uGUI / TextMeshPro)
              bi = find_builtin_dir()
              if bi:
                  for name in ("com.unity.ugui",):
                      d = os.path.join(bi, name)
                      if os.path.isdir(d):
                          print("built-in package:", name)
                          dirs.append(d)
              # 3. fallback: download from the registry
              if not dirs:
                  for name, ver in PACKAGES:
                      print("package", name, ver)
                      d = os.path.join(WORK, name)
                      if download(name, ver, d):
                          dirs.append(d)
                      else:
                          print("  FAILED - keeping the game's own copy for this package")
              if not dirs:
                  print("No packages found; nothing changed.")
                  sys.exit(0)
              process(dirs)
          EOF_REMAP
          python3 remap_ft.py

      - name: Fix decompiled code for Family Time
        if: ${{ env.GAME_KEY == 'family_time' }}
        run: |
          cat > csfix_ft.py << 'EOF_CSFIX'
          import glob, os, re

          proj = os.environ.get("PROJ", "export/ExportedProject")
          files = glob.glob(proj + "/Assets/Scripts/**/*.cs", recursive=True)

          def read(f):
              return open(f, errors="ignore").read()

          # ---------------------------------------------------------------- 1. Input actions wrapper
          # The decompiler drops some members the real Input System interface needs.
          DEV = re.compile(r"public ReadOnlyArray<InputDevice>\? devices\s*\{\s*set\s*\{\s*asset\.devices = value;\s*\}\s*\}")
          NEW_MEMBERS = (
              "public InputBinding? bindingMask\n"
              "\t{\n\t\tget { return asset.bindingMask; }\n\t\tset { asset.bindingMask = value; }\n\t}\n\n"
              "\tpublic ReadOnlyArray<InputDevice>? devices\n"
              "\t{\n\t\tget { return asset.devices; }\n\t\tset { asset.devices = value; }\n\t}\n\n"
              "\tpublic ReadOnlyArray<InputControlScheme> controlSchemes { get { return asset.controlSchemes; } }\n\n"
              "\tpublic bool Contains(InputAction action) { return asset.Contains(action); }\n\n"
              "\tpublic void Enable() { asset.Enable(); }\n\n"
              "\tpublic void Disable() { asset.Disable(); }"
          )
          for f in files:
              t = read(f)
              if "IInputActionCollection" not in t or "Contains(InputAction" in t:
                  continue
              if DEV.search(t):
                  open(f, "w").write(DEV.sub(lambda m: NEW_MEMBERS, t, count=1))
                  print("added missing Input System interface members in", f)
              else:
                  print("WARNING: could not patch", f, "(devices block not found)")

          # ---------------------------------------------------------------- 2. Names that exist in the game AND in Unity.Mathematics
          MATH_NAMES = re.compile(r"^(RigidTransform|MinMaxAABB|AffineTransform|Random|noise|math|quaternion|(half|float|int|uint|bool|double)[234](x[234])?)$")
          declared = {}  # name -> namespace
          for f in files:
              t = read(f)
              for m in re.finditer(r"^\s*(?:public |internal )?(?:sealed |static |abstract |partial |readonly |unsafe )*(?:class|struct|enum|interface)\s+(\w+)", t, re.M):
                  name = m.group(1)
                  if not MATH_NAMES.match(name):
                      continue
                  if os.path.splitext(os.path.basename(f))[0] != name:
                      continue
                  ns = ""
                  for nm in re.finditer(r"^\s*namespace\s+([\w\.]+)", t[:m.start()], re.M):
                      ns = nm.group(1)
                  declared[name] = ns
          print("game types that clash with Unity.Mathematics names:", declared)

          for f in files:
              t = read(f)
              if "using Unity.Mathematics;" not in t:
                  continue
              stem = os.path.splitext(os.path.basename(f))[0]
              add = []
              for name, ns in declared.items():
                  if stem == name or not ns:
                      continue
                  if ("using %s;" % ns) in t and re.search(r"\b%s\b" % name, t) and ("using %s =" % name) not in t:
                      add.append("using %s = %s.%s;" % (name, ns, name))
              if add:
                  t2 = t.replace("using Unity.Mathematics;", "using Unity.Mathematics;\n" + "\n".join(add), 1)
                  open(f, "w").write(t2)
                  print("alias added in", os.path.relpath(f, proj), ":", add)

          # ---------------------------------------------------------------- 3. ref/in arguments
          # The decompiler writes "ref" at call sites of methods that take "in" parameters.
          # Dropping "ref" is valid for "in" parameters, so do it for the Render Graph and Graphics APIs.
          REF_CALLS = re.compile(
              r"\b(UseTexture|UseBuffer|UseRendererList|SetGlobalTextureAfterPass|CreateTransientTexture|CreateTransientBuffer|"
              r"ImportTexture|ImportBuffer|CreateTexture|CreateBuffer|CreateRendererList|"
              r"RenderPrimitives|RenderPrimitivesIndexed|RenderPrimitivesIndirect|RenderPrimitivesIndexedIndirect|"
              r"RenderMeshPrimitives|RenderMesh|RenderMeshInstanced|RenderMeshIndirect)\(ref ")
          n_ref = 0
          for f in files:
              t = read(f)
              t2, n = REF_CALLS.subn(lambda m: m.group(1) + "(", t)
              if n:
                  open(f, "w").write(t2)
                  n_ref += n
          print("removed 'ref' from", n_ref, "calls to methods with 'in' parameters")

          # ---------------------------------------------------------------- 4. System vs UnityEngine names
          CLASHES = [
              ("Debug", "System.Diagnostics", "UnityEngine.Debug"),
              ("Object", "System", "UnityEngine.Object"),
              ("Random", "System", "UnityEngine.Random"),
          ]
          for f in files:
              t = read(f)
              if "using UnityEngine;" not in t:
                  continue
              add = []
              for name, ns, target in CLASHES:
                  if ("using %s;" % ns) in t and re.search(r"(?<![\w\.])%s\." % name, t) and ("using %s =" % name) not in t:
                      add.append("using %s = %s;" % (name, target))
              if add:
                  # the alias must not hide an explicit Unity.Mathematics Random: keep it simple and only add what is used
                  open(f, "w").write(t.replace("using UnityEngine;", "using UnityEngine;\n" + "\n".join(add), 1))
                  print("alias added in", os.path.relpath(f, proj), ":", add)

          # ---------------------------------------------------------------- 5. keep the game's DLLs away from Unity's packages
          # Precompiled DLLs in Assets/Plugins are visible to every package by default. The game has its own
          # global class called "Tools", which then hides UnityEditor.Tools inside the URP editor code.
          # "isExplicitlyReferenced: 1" turns Auto Referenced off. Nothing here needs to compile against these DLLs.
          n_meta = 0
          for meta in glob.glob(proj + "/Assets/Plugins/*.dll.meta"):
              t = read(meta)
              if re.search(r"^\s*isExplicitlyReferenced:\s*1\s*$", t, re.M):
                  continue
              if re.search(r"^(\s*)isExplicitlyReferenced:\s*0\s*$", t, re.M):
                  t2 = re.sub(r"^(\s*)isExplicitlyReferenced:\s*0\s*$", r"\1isExplicitlyReferenced: 1", t, flags=re.M)
              elif "isOverridable:" in t:
                  t2 = re.sub(r"^(\s*)isOverridable:(.*)$", r"\1isOverridable:\2\n\1isExplicitlyReferenced: 1", t, count=1, flags=re.M)
              else:
                  continue
              open(meta, "w").write(t2)
              n_meta += 1
          print("turned off Auto Referenced for", n_meta, "plugin DLLs")
          EOF_CSFIX
          python3 csfix_ft.py

      - name: Fix packages and settings for Family Time
        if: ${{ env.GAME_KEY == 'family_time' }}
        env:
          URP_SAFE: ${{ inputs.urp_safe_settings }}
        run: |
          cat > fix_ft.py << 'EOF_FT'
          import json, os, re, glob, urllib.request

          proj = "export/ExportedProject"
          os.makedirs(proj + "/Packages", exist_ok=True)
          mpath = proj + "/Packages/manifest.json"
          manifest = json.load(open(mpath)) if os.path.exists(mpath) else {"dependencies": {}}
          deps = manifest.setdefault("dependencies", {})
          print("Packages before:", json.dumps(deps, indent=1))

          # ---- the game ships stripped copies of these libraries; use the real packages instead
          for dll in ["Unity.Collections", "Unity.Burst", "Unity.Burst.Unsafe", "Unity.Mathematics"]:
              for ext in ["", ".meta"]:
                  fp = proj + "/Assets/Plugins/" + dll + ".dll" + ext
                  if os.path.exists(fp):
                      os.remove(fp)
                      print("removed stripped plugin:", fp)

          # ---- decompiler dropped operator != next to operator == (C# requires both)
          pat = re.compile(r"^(\s*)public static bool operator ==\((\S+) (\w+), (\S+) (\w+)\)\s*\n\1\{.*?\n\1\}", re.M | re.S)
          for f in glob.glob(proj + "/Assets/Scripts/**/*.cs", recursive=True):
              t = open(f, errors="ignore").read()
              if "operator ==" not in t:
                  continue
              def fix(m):
                  rest = t
                  ind, ta, a, tb, b = m.groups()
                  if ("operator !=(" + ta + " ") in rest:
                      return m.group(0)
                  print("adding operator != in", f, "for", ta)
                  return m.group(0) + "\n\n" + ind + "public static bool operator !=(" + ta + " " + a + ", " + tb + " " + b + ")\n" + ind + "{\n" + ind + "\treturn !(" + a + " == " + b + ");\n" + ind + "}"
              t2 = pat.sub(fix, t)
              if t2 != t:
                  open(f, "w").write(t2)

          # ---- which assemblies does the export already contain (to avoid duplicates with packages)
          existing = set()
          for f in glob.glob(proj + "/Assets/**/*", recursive=True):
              low = os.path.basename(f)
              if low.endswith(".dll"):
                  existing.add(low[:-4])
              elif low.endswith(".asmdef"):
                  try:
                      existing.add(json.load(open(f, errors="ignore")).get("name", ""))
                  except Exception:
                      pass
          print("Assemblies already in the export:", sorted(x for x in existing if x.startswith(("Unity", "Rewired", "Box3d")))[:40])

          def add(name, version, assemblies=()):
              if name in deps:
                  print("keep   ", name, deps[name])
                  return
              dup = [a for a in assemblies if a in existing]
              if dup:
                  print("skip   ", name, "- export already has assembly", dup)
                  return
              if not version:
                  print("skip   ", name, "- no version found")
                  return
              deps[name] = version
              print("add    ", name, version)

          # ---- core + verified packages for Unity 6000.2 (URP/VFX 17.2.0, Input System 1.14.0)
          add("com.unity.render-pipelines.universal", "17.2.0", ["Unity.RenderPipelines.Universal.Runtime"])
          add("com.unity.visualeffectgraph", "17.2.0", ["Unity.VisualEffectGraph.Runtime"])
          add("com.unity.inputsystem", "1.14.0", ["Unity.InputSystem"])

          # ---- other registry packages: ask the registry for the newest version that supports 6000.2
          def pick(name, fallback):
              try:
                  req = urllib.request.Request("https://packages.unity.com/" + name, headers={"Accept": "application/json"})
                  data = json.load(urllib.request.urlopen(req, timeout=30))
                  best = None
                  for ver, info in data.get("versions", {}).items():
                      if "-" in ver:
                          continue
                      try:
                          maj, mi = [int(x) for x in str(info.get("unity", "2019.4")).split(".")[:2]]
                          key = tuple(int(x) for x in ver.split("."))
                      except Exception:
                          continue
                      if (maj, mi) > (6000, 2):
                          continue
                      if best is None or key > best[0]:
                          best = (key, ver)
                  if best:
                      return best[1]
              except Exception as e:
                  print("registry lookup failed for", name, ":", e)
              return fallback

          # versions Unity itself resolved for URP/VFX/Input System (written by the "Resolve Unity packages" step)
          lock = {}
          try:
              lock = json.load(open("pkgproj/Packages/packages-lock.json")).get("dependencies", {})
              print("Unity resolved", len(lock), "packages for the dependencies")
          except Exception as e:
              print("no packages-lock.json from Unity (", e, ") - using the registry lookup")
          def locked(name, fallback):
              v = lock.get(name, {}).get("version")
              return v if v else fallback
          add("com.unity.ugui", locked("com.unity.ugui", "2.0.0"), ["UnityEngine.UI", "Unity.TextMeshPro"])
          add("com.unity.mathematics", locked("com.unity.mathematics", pick("com.unity.mathematics", "1.3.2")), ["Unity.Mathematics"])
          add("com.unity.burst", locked("com.unity.burst", pick("com.unity.burst", "1.8.19")), ["Unity.Burst"])
          add("com.unity.collections", locked("com.unity.collections", pick("com.unity.collections", "2.5.7")), ["Unity.Collections"])

          # ---- built-in modules: only add the ones this editor really ships
          def find_builtin():
              cands = []
              ed = os.environ.get("UNITY_EDITOR_PATH", "")
              while ed and ed != "/":
                  cands.append(ed + "/Data/Resources/PackageManager/BuiltInPackages")
                  cands.append(ed + "/Editor/Data/Resources/PackageManager/BuiltInPackages")
                  ed = os.path.dirname(ed)
              cands += glob.glob(os.path.expanduser("~/Unity/Hub/Editor/*/Editor/Data/Resources/PackageManager/BuiltInPackages"))
              for c in cands:
                  if os.path.isdir(c):
                      return c
              return None

          WANT = ["ai", "androidjni", "animation", "assetbundle", "audio", "cloth", "director", "imageconversion",
                  "imgui", "jsonserialize", "particlesystem", "physics", "physics2d", "screencapture", "terrain",
                  "terrainphysics", "tilemap", "ui", "uielements", "umbra", "unitywebrequest",
                  "unitywebrequestassetbundle", "unitywebrequestaudio", "unitywebrequesttexture", "video", "wind"]
          # present in both the 6000.0 and 6000.3 docs, so safe if the editor folder cannot be found
          SAFE = ["ai", "androidjni", "animation", "assetbundle", "audio", "cloth", "director", "imageconversion",
                  "imgui", "jsonserialize", "particlesystem", "physics", "physics2d", "screencapture", "terrain",
                  "terrainphysics", "tilemap", "ui", "uielements", "umbra", "unitywebrequest",
                  "unitywebrequestassetbundle", "unitywebrequestaudio"]
          bi = find_builtin()
          print("Built-in packages folder:", bi)
          for k in WANT if bi else SAFE:
              name = "com.unity.modules." + k
              ver = "1.0.0"
              if bi:
                  pj = os.path.join(bi, name, "package.json")
                  if not os.path.exists(pj):
                      print("skip    module not in this editor:", name)
                      continue
                  ver = json.load(open(pj)).get("version", "1.0.0")
              if name not in deps:
                  deps[name] = ver

          # ---- AssetRipper can write module names that do not exist; remove them
          for name in list(deps):
              if name == "com.unity.modules.vfx" or (bi and name.startswith("com.unity.modules.") and not os.path.exists(os.path.join(bi, name, "package.json"))):
                  print("remove  package that does not exist in this editor:", name)
                  del deps[name]

          json.dump(manifest, open(mpath, "w"), indent=2)
          print("Packages after:", json.dumps(deps, indent=1))

          # ---- make sure the new Input System is active
          ps = proj + "/ProjectSettings/ProjectSettings.asset"
          text = open(ps, errors="ignore").read()
          m = re.search(r"^  activeInputHandler: (\d+)", text, re.M)
          print("activeInputHandler =", m.group(1) if m else "not found")
          if m and m.group(1) == "0":
              text = text.replace(m.group(0), "  activeInputHandler: 2")
              open(ps, "w").write(text)
              print("activeInputHandler changed to 2 (both)")

          # ---- URP safe settings
          if os.environ.get("URP_SAFE") == "true":
              n = 0
              for f in glob.glob(proj + "/Assets/**/*.asset", recursive=True):
                  try:
                      t = open(f, errors="ignore").read()
                  except OSError:
                      continue
                  if "m_RequireOpaqueTexture:" in t and "m_RendererDataList" in t:
                      t2 = t.replace("m_RequireOpaqueTexture: 1", "m_RequireOpaqueTexture: 0")
                      print("URP asset:", f, "-> opaque texture off" if t2 != t else "-> already off")
                      if t2 != t:
                          open(f, "w").write(t2)
                      n += 1
              print("URP assets found:", n)
              if n == 0:
                  print("WARNING: no URP pipeline asset found in the export. Rendering will probably be black.")

          gs = proj + "/ProjectSettings/GraphicsSettings.asset"
          if os.path.exists(gs):
              for line in open(gs, errors="ignore"):
                  if "m_CustomRenderPipeline" in line or "m_RenderPipeline" in line:
                      print("GraphicsSettings:", line.strip())
          for f in glob.glob(proj + "/Assets/**/*.inputactions", recursive=True):
              print("InputActions asset:", f)
          EOF_FT
          python3 fix_ft.py

      - name: Replace stand-in shaders for Family Time
        if: ${{ env.GAME_KEY == 'family_time' && inputs.replace_custom_shaders }}
        run: |
          cat > shaders_ft.py << 'EOF_SHADERS'
          import os, re

          proj = os.environ.get("PROJ", "export/ExportedProject")
          sdir = proj + "/Assets/Shader"

          CUTOUT = re.compile(r"Impostor|Leaf|Billboard|Tree|Grass|Foliage|Dropoff", re.I)
          TRANSP = re.compile(r"Water|Particle|Rain|Cloud|Overlay|Preview|Behind|Rim|Pointer|Glass|Fade|Fog|Weather|Decal|Stencil|Block|Outline", re.I)
          BAD_TEX = re.compile(r"normal|noise|mask|bump|flow|depth|occlusion|metal|emission|height|lut", re.I)

          SKIP = re.compile(r"Hidden/(Universal|Core|CoreSRP|TerrainEngine|Shader Graph|kMotion|VFX)|TextMeshPro/")

          PROP = re.compile(r'^\s*(?:\[[^\]]*\]\s*)*(\w+)\s*\(\s*"[^"]*"\s*,\s*([A-Za-z0-9]+)(?:\([^)]*\))?\s*\)', re.M)

          def props_of(block):
              return [(m.group(1), m.group(2)) for m in PROP.finditer(block)]

          def pick_tex(props):
              twod = [n for n, t in props if t == "2D"]
              for pref in ("_BaseMap", "_MainTex", "_BaseColorMap", "_Albedo", "_Diffuse"):
                  if pref in twod:
                      return pref
              for n in twod:
                  if not BAD_TEX.search(n):
                      return n
              return None

          def pick_color(props):
              vec = [n for n, t in props if t in ("Vector", "Color")]
              for pref in ("_BaseColor", "_Color", "_TintColor", "_MainColor"):
                  if pref in vec:
                      return pref
              for n in vec:
                  if re.search("color|tint", n, re.I):
                      return n
              return None

          def make(name, props_block, props):
              tex = pick_tex(props)
              col = pick_color(props)
              is_hidden = name.startswith("Hidden/")
              is_sky = "skybox" in name.lower()
              is_ui = name.startswith("UI/")
              transp = bool(TRANSP.search(name)) or is_ui
              cutout = bool(CUTOUT.search(name)) and not transp
              has_cull = any(n == "_Cull" for n, t in props)

              decl = ""
              if tex:
                  decl += "\t\t\tTexture2D %s;\n\t\t\tSamplerState sampler%s;\n\t\t\tfloat4 %s_ST;\n" % (tex, tex, tex)
              if col:
                  decl += "\t\t\tfloat4 %s;\n" % col

              if is_hidden:
                  # custom full-screen/utility shader that cannot be recovered: draw nothing
                  body = "\t\t\t\tclip(-1.0);\n\t\t\t\treturn float4(0.0, 0.0, 0.0, 0.0);\n"
              elif is_sky:
                  c = ("%s.rgb" % col) if col else "float3(0.45, 0.62, 0.90)"
                  body = "\t\t\t\treturn float4(%s, 1.0);\n" % c
              else:
                  body = "\t\t\t\tfloat4 c = float4(1.0, 1.0, 1.0, 1.0);\n"
                  if tex:
                      body += "\t\t\t\tc = %s.Sample(sampler%s, i.uv);\n" % (tex, tex)
                  if col:
                      body += "\t\t\t\tc *= %s;\n" % col
                  if is_ui:
                      body += "\t\t\t\tc *= i.color;\n"
                  if cutout:
                      body += "\t\t\t\tclip(c.a - 0.5);\n"
                  if not transp:
                      body += "\t\t\t\tc.a = 1.0;\n" if not cutout else ""
                  body += "\t\t\t\treturn c;\n"

              uv_line = "o.uv = i.uv;" if not tex else "o.uv = i.uv * %s_ST.xy + %s_ST.zw;" % (tex, tex)
              if transp:
                  tags = '"RenderType"="Transparent" "Queue"="Transparent"'
                  state = "\t\t\tBlend SrcAlpha OneMinusSrcAlpha\n\t\t\tZWrite Off\n"
              elif is_sky:
                  tags = '"RenderType"="Background" "Queue"="Background" "PreviewType"="Skybox"'
                  state = "\t\t\tZWrite Off\n\t\t\tCull Off\n"
              elif cutout:
                  tags = '"RenderType"="TransparentCutout" "Queue"="AlphaTest"'
                  state = ""
              else:
                  tags = '"RenderType"="Opaque" "Queue"="Geometry"'
                  state = ""
              if is_ui:
                  state += "\t\t\tCull Off\n\t\t\tZTest [unity_GUIZTestMode]\n"
              elif not is_sky:
                  state += ("\t\t\tCull [_Cull]\n" if has_cull else "\t\t\tCull Off\n")

              return (
                  'Shader "%s" {\n%s\n'
                  "\t//AndroidPortUnlitStandIn\n"
                  "\tSubShader {\n\t\tTags { %s }\n\t\tLOD 100\n\n\t\tPass {\n\t\t\tName \"Unlit\"\n\t\t\tTags { \"LightMode\"=\"UniversalForward\" }\n"
                  "%s\n\t\t\tHLSLPROGRAM\n\t\t\t#pragma vertex vert\n\t\t\t#pragma fragment frag\n\n"
                  "\t\t\tfloat4x4 unity_ObjectToWorld;\n\t\t\tfloat4x4 unity_MatrixVP;\n%s\n"
                  "\t\t\tstruct Attributes { float4 pos : POSITION; float2 uv : TEXCOORD0; float4 color : COLOR; };\n"
                  "\t\t\tstruct Varyings { float4 pos : SV_POSITION; float2 uv : TEXCOORD0; float4 color : COLOR; };\n\n"
                  "\t\t\tVaryings vert(Attributes i)\n\t\t\t{\n\t\t\t\tVaryings o;\n"
                  "\t\t\t\to.pos = mul(unity_MatrixVP, mul(unity_ObjectToWorld, i.pos));\n"
                  "\t\t\t\t%s\n\t\t\t\to.color = i.color;\n\t\t\t\treturn o;\n\t\t\t}\n\n"
                  "\t\t\tfloat4 frag(Varyings i) : SV_Target\n\t\t\t{\n%s\t\t\t}\n\n"
                  "\t\t\tENDHLSL\n\t\t}\n\t}\n}\n"
              ) % (name, props_block, tags, state, decl, uv_line, body)

          def main():
              n = 0
              hidden = 0
              for f in sorted(os.listdir(sdir)) if os.path.isdir(sdir) else []:
                  if not f.endswith(".shader"):
                      continue
                  path = os.path.join(sdir, f)
                  t = open(path, errors="ignore").read()
                  if "DummyShaderTextExporter" not in t:
                      continue
                  m = re.search(r'^\s*Shader\s+"([^"]+)"', t, re.M)
                  pm = re.search(r"Properties\s*\{.*?\n\t\}", t, re.S)
                  if not m or not pm:
                      continue
                  name = m.group(1)
                  if SKIP.match(name):
                      continue
                  block = pm.group(0)
                  out = make(name, block, props_of(block))
                  open(path, "w").write(out)
                  n += 1
                  if name.startswith("Hidden/"):
                      hidden += 1
              print("replaced", n, "stand-in shaders with simple unlit ones (", hidden, "hidden utility shaders draw nothing )")

          if __name__ == "__main__":
              main()
          EOF_SHADERS
          python3 shaders_ft.py

      - name: Add touch controls for Family Time
        if: ${{ env.GAME_KEY == 'family_time' }}
        env:
          TOUCH_MODE: ${{ inputs.touch_mode }}
        run: |
          mkdir -p export/ExportedProject/Assets/FlintTouch
          cat > export/ExportedProject/Assets/FlintTouch/FlintTouchOverlay.cs << 'EOF_TOUCH'
          using System.Collections.Generic;
          using UnityEngine;
          using UnityEngine.InputSystem;
          using UnityEngine.InputSystem.LowLevel;
          using ETouch = UnityEngine.InputSystem.EnhancedTouch;

          // On-screen touch controls for the Android port.
          // Feeds virtual Gamepad / Keyboard / Mouse devices into the new Input System,
          // so the game's existing input bindings keep working without editing its code.
          public class FlintTouchOverlay : MonoBehaviour
          {
          	// Replaced by the workflow: Gamepad, KeyboardMouse or Both
          	const string Mode = "__TOUCH_MODE__";
          	// Tuning: raise to turn faster, lower to turn slower
          	const float LookPadScale = 0.08f;
          	const float LookMouseScale = 1.0f;

          	class Btn
          	{
          		public string label;
          		public Vector2 center;
          		public float radius;
          		public GamepadButton pad;
          		public Key key;
          	}

          	List<Btn> buttons = new List<Btn>();
          	Dictionary<int, Btn> fingerBtn = new Dictionary<int, Btn>();
          	HashSet<Btn> held = new HashSet<Btn>();
          	int joyId = -1;
          	int lookId = -1;
          	Vector2 joyOrigin;
          	Vector2 joyVec;
          	Vector2 lookDelta;
          	bool usePad;
          	bool useKb;
          	Gamepad pad;
          	Keyboard kb;
          	Mouse mouse;
          	Texture2D circle;
          	GUIStyle style;

          	[RuntimeInitializeOnLoadMethod(RuntimeInitializeLoadType.AfterSceneLoad)]
          	static void Boot()
          	{
          		if (!Application.isMobilePlatform) return;
          		if (FindFirstObjectByType<FlintTouchOverlay>() != null) return;
          		GameObject go = new GameObject("FlintTouchOverlay");
          		DontDestroyOnLoad(go);
          		go.AddComponent<FlintTouchOverlay>();
          	}

          	void Awake()
          	{
          		usePad = Mode != "KeyboardMouse";
          		useKb = Mode != "Gamepad";
          		ETouch.EnhancedTouchSupport.Enable();
          		if (usePad) pad = InputSystem.AddDevice<Gamepad>("FlintTouchGamepad");
          		if (useKb)
          		{
          			kb = InputSystem.AddDevice<Keyboard>("FlintTouchKeyboard");
          			mouse = InputSystem.AddDevice<Mouse>("FlintTouchMouse");
          		}
          		circle = MakeCircle(64);
          		Debug.Log("FLINTTOUCH: started, mode=" + Mode + " pad=" + usePad + " keyboardMouse=" + useKb);
          	}

          	static Texture2D MakeCircle(int size)
          	{
          		Texture2D tex = new Texture2D(size, size, TextureFormat.RGBA32, false);
          		float r = size / 2f;
          		for (int y = 0; y < size; y++)
          		{
          			for (int x = 0; x < size; x++)
          			{
          				float dx = x + 0.5f - r;
          				float dy = y + 0.5f - r;
          				float a = Mathf.Clamp01(r - Mathf.Sqrt(dx * dx + dy * dy));
          				tex.SetPixel(x, y, new Color(1f, 1f, 1f, a));
          			}
          		}
          		tex.Apply();
          		return tex;
          	}

          	void Add(string label, float x, float y, float radius, GamepadButton p, Key k, float s)
          	{
          		Btn b = new Btn();
          		b.label = label;
          		b.center = new Vector2(x, y);
          		b.radius = radius * s;
          		b.pad = p;
          		b.key = k;
          		buttons.Add(b);
          	}

          	void BuildButtons()
          	{
          		float s = Screen.height / 720f;
          		float w = Screen.width;
          		float h = Screen.height;
          		held.Clear();
          		buttons.Clear();
          		Add("JUMP", w - 130f * s, 170f * s, 75f, GamepadButton.South, Key.Space, s);
          		Add("USE", w - 290f * s, 110f * s, 55f, GamepadButton.West, Key.E, s);
          		Add("RUN", w - 110f * s, 340f * s, 55f, GamepadButton.LeftStick, Key.LeftShift, s);
          		Add("DUCK", w - 280f * s, 270f * s, 45f, GamepadButton.East, Key.LeftCtrl, s);
          		Add("ITEM", w - 430f * s, 110f * s, 45f, GamepadButton.North, Key.Q, s);
          		Add("II", w - 60f * s, h - 60f * s, 38f, GamepadButton.Start, Key.Escape, s);
          		foreach (KeyValuePair<int, Btn> pair in fingerBtn) held.Add(pair.Value);
          	}

          	Btn Hit(Vector2 p)
          	{
          		for (int i = 0; i < buttons.Count; i++)
          		{
          			if ((p - buttons[i].center).magnitude <= buttons[i].radius * 1.25f) return buttons[i];
          		}
          		return null;
          	}

          	void Update()
          	{
          		BuildButtons();
          		float s = Screen.height / 720f;
          		lookDelta = Vector2.zero;
          		var touches = ETouch.Touch.activeTouches;
          		for (int i = 0; i < touches.Count; i++)
          		{
          			var t = touches[i];
          			int id = t.touchId;
          			Vector2 p = t.screenPosition;
          			UnityEngine.InputSystem.TouchPhase phase = t.phase;
          			if (phase == UnityEngine.InputSystem.TouchPhase.Began)
          			{
          				Btn b = Hit(p);
          				if (b != null)
          				{
          					fingerBtn[id] = b;
          					held.Add(b);
          				}
          				else if (joyId < 0 && p.x < Screen.width * 0.4f)
          				{
          					joyId = id;
          					joyOrigin = p;
          					joyVec = Vector2.zero;
          				}
          				else if (lookId < 0)
          				{
          					lookId = id;
          				}
          			}
          			else if (phase == UnityEngine.InputSystem.TouchPhase.Moved || phase == UnityEngine.InputSystem.TouchPhase.Stationary)
          			{
          				if (id == joyId) joyVec = Vector2.ClampMagnitude((p - joyOrigin) / (90f * s), 1f);
          				else if (id == lookId) lookDelta += t.delta;
          			}
          			else if (phase == UnityEngine.InputSystem.TouchPhase.Ended || phase == UnityEngine.InputSystem.TouchPhase.Canceled)
          			{
          				Btn b;
          				if (fingerBtn.TryGetValue(id, out b))
          				{
          					held.Remove(b);
          					fingerBtn.Remove(id);
          				}
          				if (id == joyId)
          				{
          					joyId = -1;
          					joyVec = Vector2.zero;
          				}
          				if (id == lookId) lookId = -1;
          			}
          		}
          		if (touches.Count == 0)
          		{
          			fingerBtn.Clear();
          			held.Clear();
          			joyId = -1;
          			lookId = -1;
          			joyVec = Vector2.zero;
          		}
          		if (usePad && pad != null)
          		{
          			InputState.Change(pad.leftStick, joyVec);
          			InputState.Change(pad.rightStick, Vector2.ClampMagnitude(lookDelta * LookPadScale, 1f));
          			for (int i = 0; i < buttons.Count; i++)
          			{
          				InputState.Change(pad[buttons[i].pad], held.Contains(buttons[i]) ? 1f : 0f);
          			}
          		}
          		if (useKb && kb != null && mouse != null)
          		{
          			InputState.Change(kb[Key.W], joyVec.y > 0.35f ? 1f : 0f);
          			InputState.Change(kb[Key.S], joyVec.y < -0.35f ? 1f : 0f);
          			InputState.Change(kb[Key.D], joyVec.x > 0.35f ? 1f : 0f);
          			InputState.Change(kb[Key.A], joyVec.x < -0.35f ? 1f : 0f);
          			for (int i = 0; i < buttons.Count; i++)
          			{
          				InputState.Change(kb[buttons[i].key], held.Contains(buttons[i]) ? 1f : 0f);
          			}
          			InputState.Change(mouse.position, new Vector2(Screen.width / 2f, Screen.height / 2f));
          			InputState.Change(mouse.delta, lookDelta * LookMouseScale);
          		}
          	}

          	void Disc(Rect r, float ring, float fill)
          	{
          		GUI.color = new Color(1f, 1f, 1f, ring);
          		GUI.DrawTexture(r, circle);
          		float m = r.width * 0.07f;
          		GUI.color = new Color(0f, 0f, 0f, fill);
          		GUI.DrawTexture(new Rect(r.x + m, r.y + m, r.width - m * 2f, r.height - m * 2f), circle);
          		GUI.color = Color.white;
          	}

          	void OnGUI()
          	{
          		if (Event.current.type != EventType.Repaint || circle == null) return;
          		if (style == null)
          		{
          			style = new GUIStyle(GUI.skin.label);
          			style.alignment = TextAnchor.MiddleCenter;
          			style.fontStyle = FontStyle.Bold;
          			style.normal.textColor = Color.white;
          		}
          		float s = Screen.height / 720f;
          		style.fontSize = Mathf.RoundToInt(22f * s);
          		for (int i = 0; i < buttons.Count; i++)
          		{
          			Btn b = buttons[i];
          			bool on = held.Contains(b);
          			Rect r = new Rect(b.center.x - b.radius, Screen.height - b.center.y - b.radius, b.radius * 2f, b.radius * 2f);
          			Disc(r, on ? 0.9f : 0.55f, on ? 0.7f : 0.4f);
          			GUI.color = Color.white;
          			GUI.Label(r, b.label, style);
          		}
          		if (joyId >= 0)
          		{
          			float big = 90f * s;
          			float small = 40f * s;
          			Disc(new Rect(joyOrigin.x - big, Screen.height - joyOrigin.y - big, big * 2f, big * 2f), 0.4f, 0.25f);
          			Vector2 knob = joyOrigin + joyVec * big;
          			Disc(new Rect(knob.x - small, Screen.height - knob.y - small, small * 2f, small * 2f), 0.8f, 0.6f);
          		}
          	}
          }
          EOF_TOUCH
          sed -i "s/__TOUCH_MODE__/$TOUCH_MODE/" export/ExportedProject/Assets/FlintTouch/FlintTouchOverlay.cs
          grep -n "const string Mode" export/ExportedProject/Assets/FlintTouch/FlintTouchOverlay.cs

      - name: Add the Box3D Android library for Family Time
        if: ${{ env.GAME_KEY == 'family_time' }}
        env:
          GH_TOKEN: ${{ github.token }}
          IN_TAG: ${{ inputs.box3d_tag }}
        run: |
          TAG="$IN_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo ${{ github.repository }} --limit 100 --json tagName --jq '.[].tagName | select(startswith("box3d-android"))' | head -n 1)
          fi
          if [ -z "$TAG" ]; then
            echo "WARNING: no box3d-android release found. Run 'Build Box3D for Android' first."
            echo "Without libbox3d.so the game's physics will fail when it starts."
            exit 0
          fi
          D=export/ExportedProject/Assets/Plugins/Android/arm64-v8a
          mkdir -p "$D"
          gh release download "$TAG" --repo ${{ github.repository }} -p libbox3d.so -D "$D"
          echo "Added libbox3d.so from release $TAG"
          ls -l "$D"

      - name: Add build script
        run: |
          mkdir -p export/ExportedProject/Assets/Editor
          cat > export/ExportedProject/Assets/Editor/CIBuild.cs << 'EOF'
          using System;
          using System.Collections.Generic;
          using System.IO;
          using UnityEditor;
          using UnityEditor.Build.Reporting;
          using UnityEngine;

          public static class CIBuild
          {
              private static void DumpRendererAssets()
              {
                  string[] paths = Directory.GetFiles(Application.dataPath, "*.asset", SearchOption.AllDirectories);
                  foreach (string path in paths)
                  {
                      string name = Path.GetFileName(path);
                      if (name != "AndroidPlusRenderer.asset" && name != "Mask.asset" && name != "Maskable.asset")
                          continue;
                      Console.WriteLine("CIBuild: BEGIN_RENDERER_ASSET " + path);
                      try
                      {
                          Console.WriteLine(File.ReadAllText(path));
                      }
                      catch (Exception ex)
                      {
                          Console.WriteLine("CIBuild: unable to read renderer asset: " + ex.Message);
                      }
                      Console.WriteLine("CIBuild: END_RENDERER_ASSET " + name);
                  }
              }

              private static string Env(string name, string fallback)
              {
                  string v = Environment.GetEnvironmentVariable(name);
                  return string.IsNullOrEmpty(v) ? fallback : v;
              }

              private static void ConfigureAndroid()
              {
                  bool il2cpp = Env("SCRIPTING", "Mono") == "IL2CPP";
                  string arch = Env("ARCH", "ARMv7");
                  int minSdk;
                  if (!int.TryParse(Env("MIN_SDK", "22"), out minSdk)) minSdk = 22;
                  string api = Env("GRAPHICS_API", "Auto");
          #if UNITY_6000_0_OR_NEWER
                  UnityEditor.Build.NamedBuildTarget target = UnityEditor.Build.NamedBuildTarget.Android;
                  PlayerSettings.SetApplicationIdentifier(target, "com.epic.gameport");
                  PlayerSettings.SetScriptingBackend(target, il2cpp ? ScriptingImplementation.IL2CPP : ScriptingImplementation.Mono2x);
                  if (il2cpp) PlayerSettings.SetManagedStrippingLevel(target, ManagedStrippingLevel.Minimal);
          #else
                  PlayerSettings.SetApplicationIdentifier(BuildTargetGroup.Android, "com.epic.gameport");
                  PlayerSettings.SetScriptingBackend(BuildTargetGroup.Android, il2cpp ? ScriptingImplementation.IL2CPP : ScriptingImplementation.Mono2x);
          #endif
                  PlayerSettings.Android.targetArchitectures = (arch == "ARM64") ? AndroidArchitecture.ARM64 : AndroidArchitecture.ARMv7;
                  PlayerSettings.Android.minSdkVersion = (AndroidSdkVersions)minSdk;
                  if (api == "OpenGLES3" || api == "Vulkan" || api == "Vulkan_GLES3")
                  {
                      UnityEngine.Rendering.GraphicsDeviceType[] apis;
                      if (api == "Vulkan_GLES3") apis = new[] { UnityEngine.Rendering.GraphicsDeviceType.Vulkan, UnityEngine.Rendering.GraphicsDeviceType.OpenGLES3 };
                      else if (api == "Vulkan") apis = new[] { UnityEngine.Rendering.GraphicsDeviceType.Vulkan };
                      else apis = new[] { UnityEngine.Rendering.GraphicsDeviceType.OpenGLES3 };
                      PlayerSettings.SetUseDefaultGraphicsAPIs(BuildTarget.Android, false);
                      PlayerSettings.SetGraphicsAPIs(BuildTarget.Android, apis);
                  }
                  Console.WriteLine("CIBuild: backend=" + (il2cpp ? "IL2CPP" : "Mono") + " arch=" + arch + " minSdk=" + minSdk + " graphicsApi=" + api);
              }

              public static void BuildAndroid()
              {
                  var scenes = new List<string>();
                  foreach (var s in EditorBuildSettings.scenes)
                      if (s.enabled) scenes.Add(s.path);
                  Console.WriteLine("CIBuild: scenes in build = " + scenes.Count);
                  DumpRendererAssets();
                  if (scenes.Count == 0)
                  {
                      Console.WriteLine("CIBuild: no scenes found, aborting");
                      EditorApplication.Exit(2);
                      return;
                  }

                  ConfigureAndroid();
                  PlayerSettings.Android.bundleVersionCode = 1;
                  PlayerSettings.bundleVersion = "1.0";
                  EditorUserBuildSettings.buildAppBundle = false;

                  string outPath = Environment.GetEnvironmentVariable("APK_OUT");
                  if (string.IsNullOrEmpty(outPath)) outPath = Path.GetFullPath("game.apk");
                  Directory.CreateDirectory(Path.GetDirectoryName(outPath));

                  var options = new BuildPlayerOptions
                  {
                      scenes = scenes.ToArray(),
                      locationPathName = outPath,
                      target = BuildTarget.Android,
                      options = BuildOptions.None
                  };
                  var report = BuildPipeline.BuildPlayer(options);
                  Console.WriteLine("CIBuild: result = " + report.summary.result);
                  if (report.summary.result != BuildResult.Succeeded)
                      EditorApplication.Exit(1);
              }
          }
          EOF

      - name: Build APK
        env:
          SCRIPTING: ${{ env.SCRIPTING }}
          ARCH: ${{ env.ARCH }}
          MIN_SDK: ${{ env.MIN_SDK }}
          GRAPHICS_API: ${{ env.GRAPHICS_API }}
        run: |
          EDITOR="$UNITY_EDITOR_PATH"
          if [ -d "$EDITOR" ]; then
            EDITOR=$(find "$EDITOR" -maxdepth 3 -type f -name Unity | head -n 1)
          fi
          echo "Using editor: $EDITOR"
          test -x "$EDITOR" || { echo "ERROR: Unity editor not found"; exit 1; }
          export APK_OUT="$PWD/apk/game.apk"
          "$EDITOR" -batchmode -nographics -quit \
            -projectPath "$PWD/export/ExportedProject" \
            -buildTarget Android \
            -executeMethod CIBuild.BuildAndroid \
            -logFile "$PWD/unity.log"
          test -f "$APK_OUT" || { echo "ERROR: APK was not created"; exit 1; }
          ls -lh "$APK_OUT"

      - name: Show Unity errors
        if: always()
        run: |
          echo "--- error codes (count) ---"
          grep -o "error CS[0-9]*" unity.log | sort | uniq -c | sort -rn || true
          echo "--- errors (first 150) ---"
          grep -E "error CS|Shader error|CIBuild:|Build Finished|Error building|BuildFailed|Gradle build failed" unity.log | grep -v "^\[Script Updater\]" | sort -u | head -n 150 || true
          echo "--- crash details (if any) ---"
          grep -n -B3 -A22 "Crash!!!\|Obtained [0-9]* stack frames\|Stack Trace\|Segmentation" unity.log | head -n 70 || true
          echo "--- last imported assets before the end ---"
          grep -E "^Start importing|^Refresh|^Loading|Import Asset" unity.log | tail -n 15 || true
          echo "--- DLLs left in Assets/Plugins ---"
          ls export/ExportedProject/Assets/Plugins 2>/dev/null | grep "dll$" || true
          echo "--- package versions in the manifest ---"
          grep -o '"com.unity[^"]*": "[^"]*"' export/ExportedProject/Packages/manifest.json 2>/dev/null | grep -v modules || true
          tail -n 30 unity.log || true

      - name: Publish APK and log to a release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp unity.log unity-log.txt || true
          FILES="unity-log.txt"
          if [ -f apk/game.apk ]; then FILES="apk/game.apk unity-log.txt"; fi
          gh release create "build-${{ github.run_number }}" $FILES --repo ${{ github.repository }} --title "Build ${{ github.run_number }}" --notes "Android build"

      - name: Upload Unity log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: unity-log
          path: unity.log
          if-no-files-found: ignore
