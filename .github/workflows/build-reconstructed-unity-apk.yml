name: Build reconstructed Mono Android APK

on:
  workflow_dispatch:
    inputs:
      project_tag:
        description: Release tag containing the Unity project ZIP
        required: true
        default: bbplus-unity-project
      graphics_api:
        description: Android graphics API for controlled rendering A/B builds
        required: true
        type: choice
        options:
          - OpenGLES3
          - Vulkan
        default: OpenGLES3

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/share/dotnet /usr/local/share/boost
          df -h /

      - name: Checkout workflow
        uses: actions/checkout@v4

      - name: Download reconstructed Unity project
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TAG: ${{ inputs.project_tag }}
        run: |
          gh release download "$PROJECT_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "bbplus-android-mono-unityproject.zip" \
            --dir .
          unzip -q bbplus-android-mono-unityproject.zip
          test -f UnityProject/ProjectSettings/ProjectVersion.txt
          test -f UnityProject/Assets/Editor/CIAndroidBuild.cs
          # Unity 2021.3.49f1 is Extended LTS and requires an Enterprise/Industry license.
          # Use the final Personal-compatible 2021.3 patch to compile this project.
          sed -i 's/^m_EditorVersion:.*/m_EditorVersion: 2021.3.45f1/' UnityProject/ProjectSettings/ProjectVersion.txt
          echo "Unity project size:"
          du -sh UnityProject

      - name: Disable blocked Microsoft apt source on runner
        run: |
          for source in /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft.sources; do
            if [ -f "$source" ]; then sudo rm -f "$source"; fi
          done

      - name: Install Unity with Android
        id: unity-setup
        uses: RageAgainstThePixel/unity-setup@v2
        with:
          version-file: None
          unity-version: 2021.3.45f1
          build-targets: Android
          hub-version: '3.14.3'
          cache-installation: true

      - name: Activate Unity Personal license
        uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Install legacy OpenSSL runtime for Unity compiler
        run: |
          curl --fail --silent --show-error --location \
            https://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb \
            --output /tmp/libssl1.1.deb
          sudo dpkg -i /tmp/libssl1.1.deb

      - name: Swap PC plugin DLLs for real URP/TMP/UGUI packages
        run: python3 tools/ci_package_remap.py prepare UnityProject

      - name: Resolve Unity packages
        env:
          UNITY_EDITOR_PATH: ${{ steps.unity-setup.outputs.unity-editor-path }}
        run: |
          UNITY_BIN="$UNITY_EDITOR_PATH"
          [ -d "$UNITY_BIN" ] && { [ -x "$UNITY_BIN/Unity" ] && UNITY_BIN="$UNITY_BIN/Unity" || UNITY_BIN="$UNITY_BIN/Editor/Unity"; }
          [ -x "$UNITY_BIN" ] || UNITY_BIN="$(find "$HOME/Unity/Hub/Editor" /opt/unity -path '*/Editor/Unity' -type f -executable -print -quit 2>/dev/null || true)"
          mkdir -p out
          # Compile errors are expected here (references not remapped yet); we only need the package cache.
          "$UNITY_BIN" -batchmode -nographics -quit -projectPath "$GITHUB_WORKSPACE/UnityProject" \
            -logFile "$GITHUB_WORKSPACE/out/unity-resolve.log" || true
          test -d UnityProject/Library/PackageCache
          echo "UNITY_ROOT=$(dirname "$UNITY_BIN")" >> "$GITHUB_ENV"

      - name: Re-point script and shader references at the packages
        run: |
          python3 tools/ci_package_remap.py remap UnityProject \
            UnityProject/Library/PackageCache \
            "$UNITY_ROOT/Data/Resources/PackageManager/BuiltInPackages"

      - name: Build development APK
        env:
          UNITY_EDITOR_PATH: ${{ steps.unity-setup.outputs.unity-editor-path }}
          BBPLUS_GRAPHICS_API: ${{ inputs.graphics_api }}
        run: |
          UNITY_BIN="$UNITY_EDITOR_PATH"
          if [ -d "$UNITY_BIN" ]; then
            if [ -x "$UNITY_BIN/Unity" ]; then
              UNITY_BIN="$UNITY_BIN/Unity"
            elif [ -x "$UNITY_BIN/Editor/Unity" ]; then
              UNITY_BIN="$UNITY_BIN/Editor/Unity"
            fi
          fi
          if [ ! -x "$UNITY_BIN" ]; then
            UNITY_BIN="$(find "$HOME/Unity/Hub/Editor" /opt/unity -path '*/Editor/Unity' -type f -executable -print -quit 2>/dev/null || true)"
          fi
          test -x "$UNITY_BIN" || { echo "Unity executable not found; setup output was: $UNITY_EDITOR_PATH"; exit 1; }
          mkdir -p out
          "$UNITY_BIN" -batchmode -nographics -quit \
            -projectPath "$GITHUB_WORKSPACE/UnityProject" \
            -buildTarget Android \
            -executeMethod CIAndroidBuild.Build \
            -logFile "$GITHUB_WORKSPACE/out/unity-editor.log"
          # Safety net: older project versions wrote the APK to UnityProject/out
          [ -s out/bbplus-reconstructed-debug.apk ] || { [ -s UnityProject/out/bbplus-reconstructed-debug.apk ] && cp UnityProject/out/bbplus-reconstructed-debug.apk out/; }
          test -s out/bbplus-reconstructed-debug.apk

      - name: Upload build logs and APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bbplus-reconstructed-android-build
          path: |
            out/bbplus-reconstructed-debug.apk
            out/unity-editor.log
            out/unity-resolve.log
          if-no-files-found: warn
          compression-level: 0

      - name: Publish APK release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="bbplus-android-mono-build-${{ github.run_number }}"
          gh release create "$TAG" out/bbplus-reconstructed-debug.apk \
            --repo "${{ github.repository }}" \
            --title "BB+ Android Mono build ${{ github.run_number }}" \
            --notes "Development APK built from the reconstructed project using Unity 2021.3.45f1. Android ARMv7 (32-bit), Mono backend."

